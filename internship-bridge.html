function createStudent(){
  const name = document.getElementById("ns_name").value;
  const email = document.getElementById("ns_email").value;
  const regNo = document.getElementById("ns_regno").value;
  const program = document.getElementById("ns_program").value;
  const department = document.getElementById("ns_department").value;
  const semester = Number(document.getElementById("ns_semester").value)||null;
  const cgpa = Number(document.getElementById("ns_cgpa").value)||null;
  const preferredIndustry = document.getElementById("ns_industry").value;
  const password = document.getElementById("ns_password").value;
  if(!name || !email || !regNo){ toast("Name, email, and registration number are required."); return; }
  if(!password){ toast("Please set an account password for this ID."); return; }
  if(DB.users.some(u=>(u.email||"").trim().toLowerCase()===email.trim().toLowerCase())){
    toast("That login ID/email is already in use — please choose a different one.");
    return;
  }
  mutate(db=>{
    const u = { id: uid("u"), name, role:"STUDENT", email, password };
    db.users.push(u);
    db.students.push({ id: uid("s"), userId:u.id, regNo, program, department, semester, cgpa, preferredIndustry, bio:"", profileStatus:"APPROVED", cv:false, transcript:false, assignedFacultyId:null, assignedCompanySupervisorId:null });
  });
  toast("Student created — now visible in their Student Profile, Browse, Matching, and every other tab.");
  goto("students",{});
}
function saveStudentAdmin(sid){
  mutate(db=>{
    const s = db.students.find(x=>x.id===sid);
    const u = userById(s.userId);
    const newName  = document.getElementById("es_name_"+sid).value;
    const newEmail = (document.getElementById("es_email_"+sid)?.value||"").trim();
    if(newName)  { u.name  = newName; }
    if(newEmail) { u.email = newEmail; }
    s.regNo = document.getElementById("es_regno_"+sid).value;
    s.program = document.getElementById("es_program_"+sid).value;
    s.department = document.getElementById("es_dept_"+sid).value;
    s.semester = Number(document.getElementById("es_sem_"+sid).value)||null;
    s.cgpa = Number(document.getElementById("es_cgpa_"+sid).value)||null;
    s.preferredIndustry = document.getElementById("es_industry_"+sid).value;
    s.profileStatus = document.getElementById("es_status_"+sid).value;
    u.password = document.getElementById("es_password_"+sid).value;
  });
  toast("Student updated.");
}

function tagStudentsToFaculty(facultyId){
  const activeInternStudentIds = new Set(DB.internships.filter(i=>["PENDING_OFFER","OFFERED","ACTIVE"].includes(i.status)).map(i=>i.studentId));
  const availableStudents = DB.students.filter(s=>s.profileStatus==="APPROVED" && (!activeInternStudentIds.has(s.id) || s.assignedCompanySupervisorId || s.assignedFacultyId));
  mutate(db=>{
    availableStudents.forEach(s=>{
      const cb = document.getElementById(`tag_${facultyId}_${s.id}`);
      const student = db.students.find(x=>x.id===s.id);
      if(cb && cb.checked){
        student.assignedFacultyId = facultyId;
      } else if(student.assignedFacultyId===facultyId){
        student.assignedFacultyId = null;
      }
      syncStudentLinks(db, student.id);
    });
  });
  toast("Tagged students updated — records and surveys synced.");
}
async function tagStudentsToCompanySupervisor(compSupId){
  const activeInternStudentIds = new Set(DB.internships.filter(i=>["PENDING_OFFER","OFFERED","ACTIVE"].includes(i.status)).map(i=>i.studentId));
  const availableStudents = DB.students.filter(s=>s.profileStatus==="APPROVED" && (!activeInternStudentIds.has(s.id) || s.assignedCompanySupervisorId || s.assignedFacultyId));
  const newlyTagged = [];
  let openFor = null;
  await mutate(db=>{
    availableStudents.forEach(s=>{
      const cb = document.getElementById(`tagcs_${compSupId}_${s.id}`);
      const student = db.students.find(x=>x.id===s.id);
      if(cb && cb.checked){
        if(student.assignedCompanySupervisorId!==compSupId) newlyTagged.push(student.id);
        student.assignedCompanySupervisorId = compSupId;
      } else if(student.assignedCompanySupervisorId===compSupId){
        student.assignedCompanySupervisorId = null;
      }
      const internship = syncStudentLinks(db, student.id);
      if(internship && newlyTagged.includes(student.id)) openFor = internship.id;
    });
    if(openFor) notify(compSupId, "EVALUATION_DUE", "Student tagged to you", "A student has been tagged to you — their feedback survey is now open.");
  });
  toast(openFor ? "Student tagged — opening the feedback survey." : "Tagged students updated.");
  if(openFor) goto("evaluate", { internshipId: openFor, type:"MIDTERM" });
}

function tableView(rows){

}

const GAS_CODE = `// Internship Bridge — Google Apps Script backend

const FILE_NAME = "internship-bridge-data.json";

function getOrCreateFile_() {
  const folder = DriveApp.getFolderById(FOLDER_ID);
  const files = folder.getFilesByName(FILE_NAME);
  if (files.hasNext()) return files.next();
  return folder.createFile(FILE_NAME, "{}", "application/json");
}

function doGet(e) {
  const file = getOrCreateFile_();
  const content = file.getBlob().getDataAsString() || "{}";
  return ContentService.createTextOutput(content)
    .setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  try {
    const body = e.postData && e.postData.contents ? e.postData.contents : "{}";
    JSON.parse(body); // validate before writing
    const file = getOrCreateFile_();
    file.setContent(body);
    return ContentService.createTextOutput(JSON.stringify({ status: "ok" }))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ status: "error", message: String(err) }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}`;

    <div class="field"><label class="field-label">Google Apps Script Web App URL</label>
      <input type="text" id="gas_url" value="${url}" placeholder="https://script.google.com/macros/s/xxxxx/exec"/>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="saveCloudSyncUrl()">Save &amp; connect</button>
      <button class="btn btn-secondary" onclick="pushToDrive(false)">Push data to Drive now</button>
      <button class="btn btn-secondary" onclick="confirmPullFromDrive()">Pull latest from Drive</button>
    </div>
  </div>`;

  out += `<div class="card pad">
    <div class="name" style="margin-bottom:6px;">Status</div>
    <div style="font-size:13px;">Connection: ${url ? badge("APPROVED","good") : badge("NOT_STARTED")}
      ${status==="error" ? badge("REJECTED","bad") : ""}</div>
    <div class="muted" style="margin-top:6px; font-size:12.5px;">Last synced to Drive: ${lastSynced}</div>
    <div class="muted" style="margin-top:4px; font-size:12.5px;">Every time a record is created or edited anywhere in the app, the full dataset is automatically pushed to this file a moment later. Local storage always keeps a working copy too, so the app still works if Drive is briefly unreachable.</div>
  </div>`;
  return out;
}
function copyGasCode(){
  const ta = document.getElementById("gasCode");
  ta.select();
  document.execCommand && document.execCommand("copy");
  navigator.clipboard && navigator.clipboard.writeText(GAS_CODE).catch(()=>{});
  toast("Script copied — paste it into script.google.com.");
}
function saveCloudSyncUrl(){
  const url = document.getElementById("gas_url").value.trim();
  mutate(db=>{
    ensureSettings(db);
    db.settings.cloudSyncUrl = url;
  });
  if(url){
    toast("Saved. Connecting to Google Drive…");
    pushToDrive(false);
  } else {
    toast("Cloud sync URL cleared.");
  }
}
function confirmPullFromDrive(){
  if(!confirm("This replaces everything currently in the app with whatever is saved in your Google Drive file. Continue?")) return;
  pullFromDrive(false);
}
window.saveCloudSyncUrl = saveCloudSyncUrl;
window.pushToDrive = pushToDrive;
window.confirmPullFromDrive = confirmPullFromDrive;
window.copyGasCode = copyGasCode;

/* ---------------------------- Faculty: Assigned Interns ---------------------------- */
function renderFacultyInterns(user){
  const internships = myInternships(user);
  let out = pageHeader("University Supervisor Portal","Assigned Interns", "",
    "Review the company supervisor's evaluation feedback for each intern, then submit your own final marks — these are recorded on the student's record and are visible to the Industry Liaison Office in Reports.");
  if(internships.length===0){ out += `<div class="card">${emptyState("No interns assigned yet")}</div>`; return out; }

  out += internships.map(i=>{
    const s=studentById(i.studentId), u=userById(s.userId), c=companyById(i.companyId), p=postingById(i.postingId);
    const expanded = VIEW.params.expanded===i.id;
    const visits = DB.siteVisits.filter(v=>v.internshipId===i.id);
    const evals = DB.evaluations.filter(e=>e.internshipId===i.id && e.status==="SUBMITTED" && !isFacultyEval(e.type)).sort((a,b)=>a.type==="MIDTERM"?-1:1);
    const facultyMid = DB.evaluations.find(e=>e.internshipId===i.id && e.type==="FACULTY");
    const facultyFinal = DB.evaluations.find(e=>e.internshipId===i.id && e.type==="FACULTY_FINAL");
    const facultyLocked = i.facultyAssessedAt != null;
    return `<div class="card pad">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div><div class="name">${u.name}</div><div class="muted">${c.name} · ${p.title}</div></div>
        <div style="display:flex; gap:10px; align-items:center;">${badge(i.status)}${i.facultyGrade?badge("Marks: "+i.facultyScore+"/100 · "+i.facultyGrade,"good"):""}<button class="btn btn-ghost btn-sm" onclick="goto('facultyInterns',{expanded:'${expanded?'':i.id}'})">${expanded?'Hide':'Manage'}</button></div>
      </div>
      ${expanded ? `<div class="divider"></div>
        <div class="row" style="margin-bottom:14px;">
          <div class="field"><label class="field-label">Schedule a site visit</label><input type="datetime-local" id="visit_${i.id}"/></div>
          <button class="btn btn-secondary" onclick="scheduleVisit('${i.id}')">Schedule</button>
        </div>
        ${visits.map(v=>`<div class="card pad" style="margin-bottom:8px;">
          <div style="display:flex; justify-content:space-between;"><span style="font-size:13px;">${fmtDateTime(v.scheduledDate)}</span>${badge(v.status)}</div>
          ${v.status==="SCHEDULED" ? `<div class="row" style="margin-top:8px;">
            <input type="text" style="flex:1;" placeholder="Observations..." id="obs_${v.id}"/>
            <button class="btn btn-secondary btn-sm" onclick="completeVisit('${v.id}')">Mark complete</button>
          </div>` : (v.observations ? `<div class="muted" style="margin-top:6px;">${v.observations}</div>` : "")}
        </div>`).join("")}

        <div class="name" style="margin:14px 0 8px;">Company supervisor evaluation feedback</div>
        ${evals.length===0 ? `<div class="card">${emptyState("No employer evaluations submitted yet","The company supervisor's midterm/final evaluation will appear here once submitted.")}</div>` :
          evals.map(e=>`<div class="card pad" style="margin-bottom:8px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div class="name">${e.type==="MIDTERM"?"Midterm evaluation":"Final evaluation"}</div>
              ${badge(e.status)}
            </div>
            <div class="grid grid-3" style="margin-top:8px;">
              <div class="kv"><span class="muted">Score:</span><br><b>${e.totalScore}/${e.maxScore}</b></div>
              <div class="kv"><span class="muted">Marks:</span><br><b>${e.marks!=null?`${e.marks}/100 (${e.markGrade})`:"—"}</b></div>
              <div class="kv"><span class="muted">Overall assessment:</span><br><b>${e.overallGrade||"—"}</b></div>
              <div class="kv"><span class="muted">Recommend for employment:</span><br><b>${e.recommendToHire===null?"—":(e.recommendToHire?"Yes":"No")}</b></div>
            </div>
            ${e.strengths?`<div style="margin-top:8px; font-size:13px;"><span class="muted">Strengths:</span> ${e.strengths}</div>`:""}
            ${e.areasForImprovement?`<div style="margin-top:4px; font-size:13px;"><span class="muted">Areas for improvement:</span> ${e.areasForImprovement}</div>`:""}
            ${e.additionalComments?`<div style="margin-top:4px; font-size:13px;"><span class="muted">Additional comments:</span> ${e.additionalComments}</div>`:""}
          </div>`).join("")}

        <div class="name" style="margin:14px 0 8px;">University supervisor evaluation questionnaires</div>
        <div class="subtext" style="margin-bottom:8px;">Just like the company supervisor, you mark a midterm and a final evaluation on the same 20-question, 5-point Likert rubric.</div>
        ${[["FACULTY","Midterm evaluation",facultyMid],["FACULTY_FINAL","Final evaluation",facultyFinal]].map(([t,label,fe])=>`
          <div class="card pad" style="margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:12px;">
            <div>
              <div class="name">${label}</div>
              ${fe
                ? `<div class="kv"><span class="muted">Status:</span> ${badge(fe.status)} ${fe.status==="SUBMITTED"?`<span style="margin-left:8px;">Score: <b>${fe.totalScore}/${fe.maxScore}</b>${fe.marks!=null?` · Marks: <b>${fe.marks}/100 (${fe.markGrade})</b>`:""}${fe.overallGrade?` · Grade: <b>${fe.overallGrade}</b>`:""}</span>`:""}</div>`
                : `<div class="muted">Not started yet.</div>`}
            </div>
            <button class="btn btn-secondary" onclick="goto('evaluate',{internshipId:'${i.id}', type:'${t}'})">${fe&&fe.status==="SUBMITTED"?"View":(fe?"Continue":"Fill")} questionnaire</button>
          </div>`).join("")}

        <div class="name" style="margin:14px 0 8px;">Faculty (university supervisor) final assessment</div>
        <div class="card pad">
          <div class="row">
            <div class="field" style="flex:1;"><label class="field-label">Faculty marks (out of 100)</label><input type="number" min="0" max="100" id="fa_score_${i.id}" value="${i.facultyScore??''}" ${facultyLocked?"disabled":""}/></div>
            <div class="field" style="flex:1;"><label class="field-label">Grade</label>
              <select id="fa_grade_${i.id}" ${facultyLocked?"disabled":""}>
                <option value="">—</option>
                ${GRADE_OPTIONS.map(g=>`<option value="${g}" ${i.facultyGrade===g?'selected':''}>${g}</option>`).join("")}
              </select>
            </div>
          </div>
          <div class="field"><label class="field-label">Comments</label><textarea id="fa_comments_${i.id}" rows="2" ${facultyLocked?"disabled":""}>${i.facultyComments||''}</textarea></div>
          ${facultyLocked
            ? `<div style="display:flex; justify-content:space-between; align-items:center;">
                <div class="muted">Submitted ${fmtDateTime(i.facultyAssessedAt)} — visible to the Industry Liaison Office in Reports.</div>
                <button class="btn btn-secondary btn-sm" onclick="unlockAssessment('${i.id}')">Edit</button>
              </div>`
            : `<button class="btn btn-primary" onclick="submitAssessment('${i.id}')">Submit final marks</button>`}
        </div>
      ` : ""}
    </div>`;
  }).join("");
  return out;
}
function scheduleVisit(internshipId){
  const date = document.getElementById("visit_"+internshipId).value;
  if(!date){ toast("Choose a date/time first."); return; }
  mutate(db=>{
    db.siteVisits.push({ id: uid("visit"), internshipId, facultyUserId: currentUser().id, scheduledDate: date, status:"SCHEDULED", observations:"" });
    const i = internshipById(internshipId), s = studentById(i.studentId);
    notify(s.userId, "VISIT_REMINDER", "Supervisor site visit scheduled", `Your university supervisor has scheduled a site visit for ${fmtDateTime(date)}.`);
  });
  toast("Site visit scheduled.");
}
function completeVisit(visitId){
  const obs = document.getElementById("obs_"+visitId)?.value || "";
  mutate(db=>{ const v=db.siteVisits.find(x=>x.id===visitId); v.status="COMPLETED"; v.observations=obs; });
  toast("Visit marked complete.");
}
function submitAssessment(internshipId){
  const scoreEl = document.getElementById("fa_score_"+internshipId);
  const score = Number(scoreEl.value);
  const grade = document.getElementById("fa_grade_"+internshipId).value;
  const comments = document.getElementById("fa_comments_"+internshipId).value;
  if(!scoreEl.value || isNaN(score) || score<0 || score>100){ toast("Please enter faculty marks between 0 and 100."); return; }
  mutate(db=>{
    const i = db.internships.find(x=>x.id===internshipId);
    i.facultyScore = score;
    i.facultyGrade = grade || null;
    i.facultyComments = comments;
    i.facultyAssessedAt = nowISO();
    i.grade = grade || i.grade; // reflected as the internship's overall grade
    const s = studentById(i.studentId);
    notify(s.userId, "GENERAL", "Final marks recorded", `Your university supervisor has recorded your final internship marks: ${score}/100${grade?` (${grade})`:""}.`);
    const liaisons = db.users.filter(u=>u.role==="LIAISON_OFFICER"||u.role==="HOD");
    liaisons.forEach(l=>notify(l.id, "GENERAL", "Faculty marks submitted", `${currentUser().name} submitted final marks (${score}/100${grade?`, ${grade}`:""}) for ${s?userById(s.userId).name:"a student"}.`));
  });
  toast(`Faculty assessment recorded: ${score}/100 — visible to the Liaison Office.`);
}
function unlockAssessment(internshipId){
  mutate(db=>{ const i=db.internships.find(x=>x.id===internshipId); i.facultyAssessedAt = null; });
}

/* ---------------------------- Boot ---------------------------- */
if(document.readyState === "loading"){ window.addEventListener("DOMContentLoaded", boot); } else { boot(); }

</script>
