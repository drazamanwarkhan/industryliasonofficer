  out += `<div class="grid grid-3" style="margin-bottom:14px;">
    <div class="card pad"><div class="muted">Students with supervisors</div><div class="page-title" style="font-size:26px;">${linked.length}</div></div>
    <div class="card pad"><div class="muted">Surveys submitted</div><div class="page-title" style="font-size:26px;">${submitted.length}</div></div>
    <div class="card pad"><div class="muted">Surveys pending</div><div class="page-title" style="font-size:26px;">${allEvals.length - submitted.length}</div></div>
  </div>`;

  if(linked.length===0){
    return out + `<div class="card">${emptyState("No survey feedback yet","Tag a student to a company supervisor or faculty supervisor to open their feedback surveys.")}</div>`;
  }

  out += linked.map(i=>{
    const s = studentById(i.studentId); if(!s) return "";
    const su = userById(s.userId);
    const c = companyById(i.companyId);
    const compSup = userById(i.companySupervisorUserId);
    const facSup = userById(i.facultySupervisorUserId);
    const evals = DB.evaluations.filter(e=>e.internshipId===i.id);
    return `<div class="card pad" style="margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
        <div>
          <div class="name">${su?su.name:"—"} <span class="muted mono" style="font-size:11.5px;">${s.regNo}</span></div>
          <div class="muted">${c?c.name:"Company not set"} · ${s.program||""}</div>
          <div class="muted" style="margin-top:4px; font-size:12.5px;">
            Company supervisor: <b>${compSup?compSup.name:"Not assigned"}</b> ·
            University supervisor: <b>${facSup?facSup.name:"Not assigned"}</b>
          </div>
        </div>
        ${badge(i.status)}
      </div>
      <div class="divider"></div>
      ${evals.length===0 ? `<div class="muted">No surveys generated yet.</div>` : evals.map(ev=>{
        const evaluator = userById(ev.evaluatorUserId);
        const open = expanded===ev.id;
        return `<div style="padding:8px 0; border-bottom:1px solid var(--brand-50);">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
            <div>
              <div class="name" style="font-size:13px;">${EVAL_TYPE_LABEL[ev.type]||ev.type}</div>
              <div class="muted" style="font-size:12px;">Evaluator: ${evaluator?evaluator.name:"—"}${ev.status==="SUBMITTED"?` · Score ${ev.totalScore}/${ev.maxScore}${ev.overallGrade?` · Grade ${ev.overallGrade}`:""}`:""}</div>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              ${badge(ev.status)}
              <button class="btn btn-ghost btn-sm" onclick="goto('feedback',{expandedEval:'${open?"":ev.id}'})">${open?"Hide responses":"View responses"}</button>
              <button class="btn btn-secondary btn-sm" onclick="goto('evaluate',{internshipId:'${i.id}', type:'${ev.type}'})">Open survey</button>
            </div>
          </div>
          ${open ? feedbackDetail(ev) : ""}
        </div>`;
      }).join("")}
    </div>`;
  }).join("");
  return out;
}
function feedbackDetail(ev){
  const criteria = activeCriteria();
  const answered = criteria.filter(c=>ev.scores[c.id]);
  if(answered.length===0 && !ev.strengths && !ev.additionalComments){
    return `<div class="muted" style="margin-top:8px;">This survey has not been filled in yet.</div>`;
  }
  return `<div style="margin-top:10px;">
    ${answered.map((c,idx)=>`<div class="kv" style="display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--brand-50);">
      <span>${idx+1}. ${c.label}</span><b>${ev.scores[c.id]}/${c.maxScore}</b>
    </div>`).join("")}
    ${ev.strengths?`<div style="margin-top:10px;"><span class="muted">Strengths:</span><br>${ev.strengths}</div>`:""}
    ${ev.areasForImprovement?`<div style="margin-top:8px;"><span class="muted">Areas for improvement:</span><br>${ev.areasForImprovement}</div>`:""}
    ${ev.additionalComments?`<div style="margin-top:8px;"><span class="muted">Additional comments:</span><br>${ev.additionalComments}</div>`:""}
  </div>`;
}

/* ---------------------------- KEY FEATURE: Evaluation form ---------------------------- */
/* Employer Internship Evaluation Form — Internship Performance Assessment.
   20 criteria, each scored 1–10 (200 total), plus employer/company/student
   header details, recommendation flags, an overall grade, and open-ended
   comments — mirrors the university's official evaluation form. */
function renderEvaluationForm(user, internshipId, type){
  const internship = internshipById(internshipId);
  const s = studentById(internship.studentId), su = userById(s.userId);
  const c = companyById(internship.companyId);
  const compSup = userById(internship.companySupervisorUserId) || (c ? DB.users.find(u=>u.role==="EMPLOYER" && u.companyId===c.id) : null);
  const empContact = compSup;
  const criteria = activeCriteria();

  let ev = DB.evaluations.find(e=>e.internshipId===internshipId && e.type===type);
  if(!ev){
    ev = { id: uid("ev"), internshipId, type,
      evaluatorUserId: (user.role==="EMPLOYER"||user.role==="FACULTY_SUPERVISOR") ? user.id
        : (isFacultyEval(type) ? internship.facultySupervisorUserId : internship.companySupervisorUserId),
      scores:{}, comments:{}, strengths:"", areasForImprovement:"", additionalComments:"", overallGrade:null,
      recommendToHire:null, wouldHostAgain:null, status:"NOT_STARTED", totalScore:null, maxScore:null };
    DB.evaluations.push(ev);
    saveDB();
  }
  const locked = ev.status==="SUBMITTED";
  const marked = criteria.filter(c=>ev.scores[c.id]).length;

  const backTab = user.role==="FACULTY_SUPERVISOR" ? "facultyInterns" : (user.role==="HOD"||user.role==="LIAISON_OFFICER") ? (VIEW.params.from||"feedback") : "interns";
  let out = `<a onclick="goto('${backTab}')" style="font-size:13px; color:var(--brand-500); cursor:pointer;">&larr; Back</a>`;
  out += `<div class="header-row" style="margin-top:10px;">
    <div>
      <div class="eyebrow">${type==="MIDTERM"?"Midterm Evaluation":type==="FINAL"?"Final Evaluation":type==="FACULTY"?"University Supervisor Midterm Evaluation":"University Supervisor Final Evaluation"} · 5-point Likert-scale questionnaire</div>
      <h1 class="page-title">${isFacultyEval(type)?"University Supervisor Evaluation Form":"Employer Internship Evaluation Form"}</h1>
      <div class="subtext">${isFacultyEval(type)?"Faculty (university) supervisors mark":"Company supervisors mark"} each criterion on a 5-point Likert scale (Poor, Fair, Satisfactory, Good, Excellent) — the same rubric used on both the employer and university supervisor evaluations.</div>
    </div>
    ${badge(ev.status)}
  </div>`;

  out += `<div class="card pad">
    <div class="grid grid-3">
      <div class="kv"><span class="muted">Student name:</span><br><b>${su.name}</b></div>
      <div class="kv"><span class="muted">Student ID (Reg No):</span><br><b class="mono">${s.regNo}</b></div>
      <div class="kv"><span class="muted">Program:</span><br><b>${s.program}</b></div>
      <div class="kv" style="grid-column:1/-1;"><span class="muted">Internship duration:</span><br><b>${fmtDate(internship.startDate)} – ${fmtDate(internship.endDate)}</b></div>
    </div>
  </div>`;

  out += isFacultyEval(type) ? `<div class="card pad" style="margin-top:12px;">
    <div class="name" style="margin-bottom:10px;">Employer / Company Supervisor Details</div>
    <div class="grid grid-3">
      <div class="kv"><span class="muted">Company:</span><br><b>${c?c.name:'—'}</b></div>
      <div class="kv" style="grid-column:span 2;"><span class="muted">Employer / company supervisor:</span><br><b>${compSup?compSup.name:'—'}</b> ${compSup?.email?`<br><span class="muted mono" style="font-size:11.5px;">${compSup.email}</span>`:''}</div>
    </div>
  </div>` : `<div class="card pad" style="margin-top:12px;">
    <div class="name" style="margin-bottom:4px;">Employer / Company Supervisor Details</div>
    <div class="subtext" style="margin-bottom:10px;">Confirm or fill these in — saving will automatically create or update the company profile and the employer / company supervisor record so the Liaison Office has them on file.</div>
    <div class="field"><label class="field-label">Company name</label><input type="text" id="ed_company" value="${c?c.name:''}" ${locked?"disabled":""}/></div>

    <div class="muted" style="margin:14px 0 6px; font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em;">Employer / company supervisor</div>
    <div class="grid grid-2">
      <div class="field"><label class="field-label">Name</label><input type="text" id="ed_sup_name" value="${compSup?compSup.name:''}" ${locked?"disabled":""}/></div>
      <div class="field"><label class="field-label">Email address</label><input type="email" id="ed_sup_email" value="${compSup?(compSup.email||''):''}" ${locked?"disabled":""}/></div>
      <div class="field"><label class="field-label">Mobile number</label><input type="text" id="ed_sup_mobile" value="${compSup?(compSup.mobile||''):''}" ${locked?"disabled":""}/></div>
      <div class="row" style="gap:8px;">
        <div class="field" style="flex:2;"><label class="field-label">Landline number</label><input type="text" id="ed_sup_landline" value="${compSup?(compSup.landline||''):''}" ${locked?"disabled":""}/></div>
        <div class="field" style="flex:1;"><label class="field-label">Ext.</label><input type="text" id="ed_sup_ext" value="${compSup?(compSup.landlineExt||''):''}" ${locked?"disabled":""}/></div>
      </div>
    </div>
    ${!locked ? `<button class="btn btn-secondary btn-sm" onclick="saveEmployerDetails('${internship.id}')">Save employer details</button>` : ""}
  </div>`;

  out += `<div class="rating-legend" style="margin-top:14px;">
    <span><b>1–2</b> Poor</span><span><b>3–4</b> Fair</span><span><b>5–6</b> Satisfactory</span>
    <span><b>7–8</b> Good</span><span><b>9–10</b> Excellent</span>
  </div>`;

  out += `<div class="card">` + criteria.map((cr,idx)=>{
    const sel = ev.scores[cr.id];
    return `<div class="pad" style="border-bottom:1px solid var(--brand-50);">
      <div class="name">${idx+1}. ${cr.label}</div>
      <div class="likert-scale">
        ${LIKERT_POINTS.map(pt=>`<div class="likert-opt ${sel===pt.n?'sel':''} ${locked?'locked':''}" onclick="${locked?'':`setScore('${ev.id}','${cr.id}',${pt.n})`}">
          <span class="n">${pt.label}</span><span class="l">${pt.n-1}–${pt.n}</span>
        </div>`).join("")}
      </div>
      <input type="text" style="margin-top:10px;" placeholder="Optional comment for this question..." value="${ev.comments[cr.id]||''}"
        ${locked?"disabled":""} onchange="setComment('${ev.id}','${cr.id}', this.value)"/>
    </div>`;
  }).join("") + `</div>`;

  out += `<div class="card pad" style="margin-top:14px;">
    <div class="name" style="margin-bottom:10px;">Overall Assessment</div>
    <div class="grid grid-2">
      <div class="field">
        <label class="field-label">Would you recommend this student for future employment?</label>
        <div style="display:flex; gap:8px;">
          <button class="btn ${ev.recommendToHire===true?'btn-primary':'btn-secondary'}" ${locked?"disabled":""} onclick="setFlag('${ev.id}','recommendToHire',true)">Yes</button>
          <button class="btn ${ev.recommendToHire===false?'btn-danger':'btn-secondary'}" ${locked?"disabled":""} onclick="setFlag('${ev.id}','recommendToHire',false)">No</button>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Would you be willing to host interns from our university again?</label>
        <div style="display:flex; gap:8px;">
          <button class="btn ${ev.wouldHostAgain===true?'btn-primary':'btn-secondary'}" ${locked?"disabled":""} onclick="setFlag('${ev.id}','wouldHostAgain',true)">Yes</button>
          <button class="btn ${ev.wouldHostAgain===false?'btn-danger':'btn-secondary'}" ${locked?"disabled":""} onclick="setFlag('${ev.id}','wouldHostAgain',false)">No</button>
        </div>
      </div>
    </div>
    <div class="field" style="margin-top:6px;">
      <label class="field-label">Overall grade</label>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        ${GRADE_OPTIONS.map(g=>`<button class="btn ${ev.overallGrade===g?'btn-primary':'btn-secondary'} btn-sm" ${locked?"disabled":""} onclick="setFlag('${ev.id}','overallGrade','${g}')">${g}</button>`).join("")}
      </div>
    </div>
  </div>`;

  out += `<div class="card pad" style="margin-top:14px;">
    <div class="name" style="margin-bottom:10px;">Suggested Marking Scheme</div>
    <table><thead><tr><th>Total score (out of 200)</th><th>Internship marks (out of 100)</th><th>Grade</th></tr></thead>
    <tbody>${MARKING_SCHEME.map(r=>`<tr><td>${r.range}</td><td>${r.marks}</td><td>${r.grade}</td></tr>`).join("")}</tbody></table>
  </div>`;

  out += `<div class="card pad" style="margin-top:14px;">
    <div class="name" style="margin-bottom:10px;">Optional Open-Ended Comments</div>
    <div class="field"><label class="field-label">Student's strengths</label>
      <textarea id="ov_strengths" rows="2" ${locked?"disabled":""}>${ev.strengths||""}</textarea>
    </div>
    <div class="field"><label class="field-label">Areas for improvement</label>
      <textarea id="ov_improve" rows="2" ${locked?"disabled":""}>${ev.areasForImprovement||""}</textarea>
    </div>
    <div class="field"><label class="field-label">Additional comments</label>
      <textarea id="ov_additional" rows="2" ${locked?"disabled":""}>${ev.additionalComments||""}</textarea>
    </div>
    <div class="divider"></div>
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div class="muted">${marked} of ${criteria.length} questions marked</div>
      ${!locked ? `<div style="display:flex; gap:8px;">
        <button class="btn btn-secondary" onclick="saveOverall('${ev.id}'); toast('Draft saved.')">Save draft</button>
        <button class="btn btn-primary" onclick="submitEvaluation('${ev.id}')">Submit evaluation</button>
      </div>` : ""}
    </div>
    ${locked && ev.totalScore!=null ? `<div style="margin-top:12px; background:rgba(30,124,107,.1); padding:10px 14px; border-radius:8px; font-size:13.5px;">Final score: <b>${ev.totalScore}</b> / ${ev.maxScore} &middot; Internship marks: <b>${ev.marks}</b> / 100 &middot; Grade: <b>${ev.markGrade}</b>${ev.overallGrade?` · Overall assessment: <b>${ev.overallGrade}</b>`:""}</div>` : ""}
  </div>`;
  return out;
}
function setScore(evId, critId, n){
  mutate(db=>{ const ev = db.evaluations.find(e=>e.id===evId); ev.scores[critId]=n; if(ev.status==="NOT_STARTED") ev.status="DRAFT"; });
}
function collectEmployerDetailsForm(){
  return {
    companyName: document.getElementById("ed_company").value.trim(),
    supName: document.getElementById("ed_sup_name").value.trim(),
    supEmail: document.getElementById("ed_sup_email").value.trim(),
    supMobile: document.getElementById("ed_sup_mobile").value.trim(),
    supLandline: document.getElementById("ed_sup_landline").value.trim(),
    supExt: document.getElementById("ed_sup_ext").value.trim(),
  };
}
function applyEmployerDetails(db, internship, f){
  if(!f.companyName) return;
  let company = db.companies.find(co=>co.id===internship.companyId);
  if(!company){
    // Company profile automatically created from the evaluation form.
    company = { id: uid("co"), name: f.companyName, industry:"", approvalStatus:"APPROVED", website:"", description:"" };
    db.companies.push(company);
    internship.companyId = company.id;
  } else if(company.name !== f.companyName){
    company.name = f.companyName;
  }
  // Employer contact and company supervisor are the same person / account.
  let supervisor = db.users.find(u=>u.id===internship.companySupervisorUserId)
    || db.users.find(u=>u.role==="EMPLOYER" && u.companyId===company.id);
  if(!supervisor && f.supName){
    supervisor = { id: uid("u"), name: f.supName, role:"EMPLOYER", email: f.supEmail, mobile: f.supMobile, landline: f.supLandline, landlineExt: f.supExt, companyId: company.id };
    db.users.push(supervisor);
  }
  if(supervisor){
    if(f.supName) supervisor.name = f.supName;
    supervisor.email = f.supEmail;
    supervisor.mobile = f.supMobile;
    supervisor.landline = f.supLandline;
    supervisor.landlineExt = f.supExt;
    supervisor.companyId = company.id;
    internship.companySupervisorUserId = supervisor.id;
    activateIfSupervised(internship);
  }
}
function saveEmployerDetails(internshipId){
  const f = collectEmployerDetailsForm();
  if(!f.companyName){ toast("Please provide a company name."); return; }
  mutate(db=>{
    const internship = db.internships.find(i=>i.id===internshipId);
    applyEmployerDetails(db, internship, f);
  });
  toast("Employer details saved — company profile is up to date.");
}
function setComment(evId, critId, val){
  mutate(db=>{ const ev = db.evaluations.find(e=>e.id===evId); ev.comments[critId]=val; });
}
function setFlag(evId, field, val){
  mutate(db=>{ const ev = db.evaluations.find(e=>e.id===evId); ev[field]=val; if(ev.status==="NOT_STARTED") ev.status="DRAFT"; });
}
function saveOverall(evId){
  mutate(db=>{
    const ev = db.evaluations.find(e=>e.id===evId);
    ev.strengths = document.getElementById("ov_strengths") ? document.getElementById("ov_strengths").value : ev.strengths;
    ev.areasForImprovement = document.getElementById("ov_improve") ? document.getElementById("ov_improve").value : ev.areasForImprovement;
    ev.additionalComments = document.getElementById("ov_additional") ? document.getElementById("ov_additional").value : ev.additionalComments;
    if(ev.status==="NOT_STARTED") ev.status="DRAFT";
  });
}
function submitEvaluation(evId){
  const ev = DB.evaluations.find(e=>e.id===evId);
  const criteria = activeCriteria();
  if(criteria.some(c=>!ev.scores[c.id])){ toast("Please mark every question before submitting."); return; }
  mutate(db=>{
    const e = db.evaluations.find(x=>x.id===evId);
    e.strengths = document.getElementById("ov_strengths") ? document.getElementById("ov_strengths").value : e.strengths;
    e.areasForImprovement = document.getElementById("ov_improve") ? document.getElementById("ov_improve").value : e.areasForImprovement;
    e.additionalComments = document.getElementById("ov_additional") ? document.getElementById("ov_additional").value : e.additionalComments;
    e.totalScore = criteria.reduce((sum,c)=>sum+(e.scores[c.id]||0),0);
    e.maxScore = criteria.length*10;
    const mk = computeMarking(e.totalScore, e.maxScore);
    e.marks = mk.marks;
    e.markGrade = mk.grade;
    e.status = "SUBMITTED";
    const internship = internshipById(e.internshipId);

    // Auto-create/update the company profile, employer contact, and company
    // supervisor record from whatever is currently filled into the Employer
    // & Company Supervisor Details fields, so these are always on file once
    // an evaluation has been filled in.
    const companyNameEl = document.getElementById("ed_company");
    if(companyNameEl){
      applyEmployerDetails(db, internship, collectEmployerDetailsForm());
    }

    const s = studentById(internship.studentId);
    if(isFacultyEval(e.type)){
      notify(s.userId, "GENERAL", "University supervisor evaluation submitted", `Your university supervisor has submitted their ${e.type==="FACULTY"?"midterm":"final"} evaluation (${e.totalScore}/${e.maxScore}).`);
      const liaisons = db.users.filter(u=>u.role==="LIAISON_OFFICER"||u.role==="HOD");
      liaisons.forEach(l=>notify(l.id, "GENERAL", "University supervisor evaluation submitted", `${currentUser().name} submitted a university supervisor evaluation for ${userById(s.userId).name}.`));
    } else {
      notify(s.userId, "GENERAL", `${e.type==="MIDTERM"?"Midterm":"Final"} evaluation submitted`, `Your employer has submitted your ${e.type.toLowerCase()} evaluation (${e.totalScore}/${e.maxScore}).`);
      if(internship.facultySupervisorUserId){
        notify(internship.facultySupervisorUserId, "EVALUATION_DUE", `Employer ${e.type.toLowerCase()} evaluation submitted`, "An employer evaluation has been submitted for one of your assigned interns.");
      }
    }
  });
  toast("Evaluation submitted and locked.");
}

        <div class="field"><label class="field-label">Department</label><input type="text" id="na_sdept"/></div>
      </div>

function createAccount(){
  const name = document.getElementById("na_name").value.trim();
  const email = document.getElementById("na_email").value.trim();
  const password = document.getElementById("na_password").value;
  const role = document.getElementById("na_role").value;
  if(!name || !email){ toast("Full name and login ID/email are required."); return; }
  if(!password){ toast("Please set an account password for this ID."); return; }
  if(DB.users.some(u=>(u.email||"").trim().toLowerCase()===email.trim().toLowerCase())){
    toast("That login ID is already in use — please choose a different one.");
    return;
  }
  mutate(db=>{
    const u = { id: uid("u"), name, role, email, password };
    if(role==="STUDENT"){
      const regNo = document.getElementById("na_regno").value;
      const program = document.getElementById("na_program").value;
      const department = document.getElementById("na_sdept").value;
      db.users.push(u);
      db.students.push({ id: uid("s"), userId:u.id, regNo, program, department, semester:null, cgpa:null, preferredIndustry:"", bio:"", profileStatus:"APPROVED", cv:false, transcript:false, assignedFacultyId:null, assignedCompanySupervisorId:null });
    } else if(role==="EMPLOYER"){
      u.companyId = document.getElementById("na_company").value;
      u.mobile = document.getElementById("na_mobile").value;
      db.users.push(u);
    } else if(role==="FACULTY_SUPERVISOR"){
      u.department = document.getElementById("na_fdept").value;
      u.maxLoad = Number(document.getElementById("na_maxload").value)||10;
      db.users.push(u);
    } else if(role==="HOD"){
      u.department = document.getElementById("na_hdept").value;
      db.users.push(u);
    } else {
      db.users.push(u);
    }
  });
  toast("Account created and role assigned.");

}
function saveAccount(id){
  mutate(db=>{
    const u = db.users.find(x=>x.id===id);
    u.name = document.getElementById("ea_name_"+id).value;
    u.email = document.getElementById("ea_email_"+id).value;
    u.password = document.getElementById("ea_password_"+id).value;
    u.role = document.getElementById("ea_role_"+id).value;
  });
  toast("Account updated.");
}
// Editing the HOD account requires re-entering the current HOD password
// first (default: pedigree1) — this guards the protected super-admin login
// from being changed by anyone who doesn't actually know its password.
function requestHodEdit(id){
  const u = DB.users.find(x=>x.id===id);
  if(!u) return;
  const pw = prompt("Enter the HOD account password to edit this account:");
  if(pw===null) return; // cancelled
  if(pw !== u.password){
    toast("Incorrect password — the HOD account was not opened for editing.");
    return;
  }
  goto("accounts",{editingAcct:id});
}
function deleteAccount(id){
  const target = DB.users.find(u=>u.id===id);
  const me = currentUser();
  if(!target){ return; }
  if(target.id === me.id){ toast("You can't delete the account you're currently logged in as."); return; }
  if(target.role==="HOD" && me.role!=="HOD"){
    toast("Only the HOD can delete a HOD account.");
    return;
  }
  if(target.role==="HOD" && DB.users.filter(u=>u.role==="HOD").length<=1){
    toast("You can't delete the only HOD account in the system.");
    return;
  }
  if(!confirm(`Delete the account for ${target.name}? This cannot be undone.`)) return;
  mutate(db=>{
    db.users = db.users.filter(u=>u.id!==id);
    if(target.role==="STUDENT"){
      db.students = db.students.filter(s=>s.userId!==id);
    }
  });
  toast("Account deleted.");
}

function tagStudentsToFaculty(facultyId){
  const activeInternStudentIds = new Set(DB.internships.filter(i=>["PENDING_OFFER","OFFERED","ACTIVE"].includes(i.status)).map(i=>i.studentId));
  const availableStudents = DB.students.filter(s=>s.profileStatus==="APPROVED" && (!activeInternStudentIds.has(s.id) || s.assignedCompanySupervisorId || s.assignedFacultyId));
  mutate(db=>{
    availableStudents.forEach(s=>{
      const cb = document.getElementById(`tag_${facultyId}_${s.id}`);
      const student = db.students.find(x=>x.id===s.id);
      if(cb && cb.checked){
        student.assignedFacultyId = facultyId;
      } else if(student.assignedFacultyId===facultyId){
        student.assignedFacultyId = null;
      }
      syncStudentLinks(db, student.id);
    });
  });
  toast("Tagged students updated — records and surveys synced.");
}
async function tagStudentsToCompanySupervisor(compSupId){
  const activeInternStudentIds = new Set(DB.internships.filter(i=>["PENDING_OFFER","OFFERED","ACTIVE"].includes(i.status)).map(i=>i.studentId));
  const availableStudents = DB.students.filter(s=>s.profileStatus==="APPROVED" && (!activeInternStudentIds.has(s.id) || s.assignedCompanySupervisorId || s.assignedFacultyId));
  const newlyTagged = [];
  let openFor = null;
  await mutate(db=>{
    availableStudents.forEach(s=>{
      const cb = document.getElementById(`tagcs_${compSupId}_${s.id}`);
      const student = db.students.find(x=>x.id===s.id);
      if(cb && cb.checked){
        if(student.assignedCompanySupervisorId!==compSupId) newlyTagged.push(student.id);
        student.assignedCompanySupervisorId = compSupId;
      } else if(student.assignedCompanySupervisorId===compSupId){
        student.assignedCompanySupervisorId = null;
      }
      const internship = syncStudentLinks(db, student.id);
      if(internship && newlyTagged.includes(student.id)) openFor = internship.id;
    });
    if(openFor) notify(compSupId, "EVALUATION_DUE", "Student tagged to you", "A student has been tagged to you — their feedback survey is now open.");
  });
  toast(openFor ? "Student tagged — opening the feedback survey." : "Tagged students updated.");
  if(openFor) goto("evaluate", { internshipId: openFor, type:"MIDTERM" });
}
function toggleSupervisorTypeFields(){
  const type = document.getElementById("nsup_type").value;
  document.getElementById("nsup_faculty_fields").style.display = type==="FACULTY"?"grid":"none";
  document.getElementById("nsup_company_fields").style.display = type==="COMPANY"?"grid":"none";
}
function createSupervisor(){
  const type = document.getElementById("nsup_type").value;
  const name = document.getElementById("nsup_name").value;
  const email = document.getElementById("nsup_email").value;
  const password = document.getElementById("nsup_password").value;
  if(!name||!email){ toast("Name and email are required."); return; }
  if(!password){ toast("Please set an account password for this ID."); return; }
  if(DB.users.some(u=>(u.email||"").trim().toLowerCase()===email.trim().toLowerCase())){
    toast("That login ID/email is already in use — please choose a different one.");
    return;
  }
  mutate(db=>{
    if(type==="FACULTY"){
      const department = document.getElementById("nsup_department").value;
      const maxLoad = Number(document.getElementById("nsup_maxload").value)||10;
      db.users.push({ id: uid("u"), name, role:"FACULTY_SUPERVISOR", email, password, department, maxLoad });
    } else {
      const companyId = document.getElementById("nsup_company").value;
      const mobile = document.getElementById("nsup_mobile").value;
      const landline = document.getElementById("nsup_landline").value;
      const landlineExt = document.getElementById("nsup_ext").value;
      db.users.push({ id: uid("u"), name, role:"EMPLOYER", email, password, companyId, mobile, landline, landlineExt });
    }
  });
  toast("Supervisor created.");
  goto("supervisors",{});
}

function liaisonReview(appId, approve){
  const app = applicationById(appId);

  mutate(db=>{

    notify(u.id, "APPLICATION_UPDATE", approve?"Application forwarded to employer":"Application not approved",
      approve ? `Your application for "${p.title}" was approved by the Liaison Office and sent to the employer.` : `Your application for "${p.title}" was not approved.`);
  });
  toast(approve?"Forwarded to employer.":"Application rejected.");
}
function assignFaculty(internshipId){
  const facId = document.getElementById("fac_"+internshipId).value;

    db.internships.find(x=>x.id===internshipId).facultySupervisorUserId = facId;

  } else if(tab==="faculty"){
    const rows = DB.users.filter(u=>u.role==="FACULTY_SUPERVISOR").map(f=>({
      Name:f.name, Department:f.department, "Current load": DB.internships.filter(i=>i.facultySupervisorUserId===f.id).length, "Max load": f.maxLoad
    }));
    out += tableView(rows);
  } else if(tab==="feedback"){
    const rows = DB.evaluations.filter(e=>e.status==="SUBMITTED").map(e=>{
      const i=internshipById(e.internshipId), s=studentById(i.studentId), u=userById(s.userId), c=companyById(i.companyId);
      const compSup = userById(i.companySupervisorUserId);
      return { Student:u.name, Program:s.program, Company:c.name, "Company supervisor": compSup?compSup.name:"—", Type:e.type, Score:`${e.totalScore}/${e.maxScore}`,
        Marks: e.marks!=null ? `${e.marks}/100` : "—",
        "Marks grade": e.markGrade || "—",
        "Overall assessment": e.overallGrade || "—",
        "Recommend for employment": e.recommendToHire===null?"—":(e.recommendToHire?"Yes":"No"),
        "Host again": e.wouldHostAgain===null?"—":(e.wouldHostAgain?"Yes":"No") };
    });
    out += tableView(rows);
  } else if(tab==="performance"){
    const rows = DB.internships.map(i=>{
      const s=studentById(i.studentId), u=userById(s.userId), c=companyById(i.companyId);
      const facSup = userById(i.facultySupervisorUserId);
      return { Student:u.name, Company:c.name, Status:i.status,
        "University supervisor": facSup?facSup.name:"—",
        "Faculty marks": i.facultyScore!=null ? `${i.facultyScore}/100` : "Pending",
        "Faculty grade": i.facultyGrade || "—",
        Grade: i.grade || "N/A" };
    });
    out += tableView(rows);
  } else if(tab==="placement"){
    out += `<div class="card grid grid-3 pad">
      ${statCard("Total students", DB.students.length)}
      ${statCard("Total applications", DB.applications.length)}
      ${statCard("Total placements", DB.internships.length)}
    </div>`;
  }
  return out;
}
function tableView(rows){
  if(rows.length===0) return `<div class="card">${emptyState("No data yet")}</div>`;
  const cols = Object.keys(rows[0]);
  return `<div class="card" style="overflow-x:auto;"><table>
    <thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${r[c]}</td>`).join("")}</tr>`).join("")}</tbody>
  </table></div>`;
}

/* ---------------------------- Liaison / HOD: Cloud Sync (Google Drive) ---------------------------- */
const GAS_CODE = `// Internship Bridge — Google Apps Script backend
// Saves the app's data as a single JSON file inside your Drive folder.
//
// SETUP:
// 1. Go to script.google.com -> New project. Paste this whole file in,
//    replacing the default code.
// 2. Deploy -> New deployment -> type "Web app".
//    - Execute as: Me
//    - Who has access: Anyone   (NOT "Anyone within your organisation")
// 2b. Whenever you change this script, you must Deploy -> Manage deployments
//     -> edit the deployment -> Version: New version, or Google keeps serving
//     the old code and saving will fail with HTTP 405.
// 3. Copy the Web app URL it gives you and paste it into the
//    "Google Apps Script Web App URL" box on this page, then click Save.
//
// Your folder: https://drive.google.com/drive/folders/1-4CCZyL5a6bewjJ532-4CuUz4MsAArBY

const FOLDER_ID = "1-4CCZyL5a6bewjJ532-4CuUz4MsAArBY";
const FILE_NAME = "internship-bridge-data.json";

function getOrCreateFile_() {
  const folder = DriveApp.getFolderById(FOLDER_ID);
  const files = folder.getFilesByName(FILE_NAME);
  if (files.hasNext()) return files.next();
  return folder.createFile(FILE_NAME, "{}", "application/json");
}

function doGet(e) {
  const file = getOrCreateFile_();
  const content = file.getBlob().getDataAsString() || "{}";
  return ContentService.createTextOutput(content)
    .setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  try {
    const body = (e && e.postData && e.postData.contents)
      ? e.postData.contents
      : (e && e.parameter && e.parameter.payload ? e.parameter.payload : "{}");
    JSON.parse(body); // validate before writing
    const file = getOrCreateFile_();
    file.setContent(body);
    return ContentService.createTextOutput(JSON.stringify({ status: "ok" }))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ status: "error", message: String(err) }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}`;
function renderCloudSync(user){
  const url = DB.settings?.cloudSyncUrl || "";
  const status = DB.settings?.lastSyncStatus || "";
  const lastSynced = DB.settings?.lastSyncedAt ? new Date(DB.settings.lastSyncedAt).toLocaleString() : "Never";
  let out = pageHeader("Industry Liaison Office · Administrator","Cloud Sync (Google Drive)", "",
    "Every save in Internship Bridge is pushed to a JSON file in your Google Drive folder through a small Google Apps Script. Set it up once below.");

  out += `<div class="card pad" style="margin-bottom:14px;">
    <div class="name" style="margin-bottom:6px;">Your Drive folder</div>
    <a href="https://drive.google.com/drive/folders/1-4CCZyL5a6bewjJ532-4CuUz4MsAArBY?usp=sharing" target="_blank" rel="noopener" class="mono" style="font-size:12.5px;">https://drive.google.com/drive/folders/1-4CCZyL5a6bewjJ532-4CuUz4MsAArBY</a>
    <div class="muted" style="margin-top:6px; font-size:12.5px;">The data is stored there as a single file named <span class="mono">internship-bridge-data.json</span>.</div>
  </div>`;

  out += `<div class="card pad" style="margin-bottom:14px;">
    <div class="name" style="margin-bottom:8px;">1. Deploy the Apps Script Web App</div>
    <ol style="margin:0 0 10px 18px; padding:0; font-size:13px; line-height:1.7;">
      <li>Open <a href="https://script.google.com" target="_blank" rel="noopener">script.google.com</a> and start a <b>New project</b>.</li>
      <li>Delete the placeholder code and paste in the script below (it already points at your folder).</li>
      <li><b>Deploy → New deployment → type "Web app"</b>. Set <i>Execute as: Me</i> and <i>Who has access: Anyone</i>, then click Deploy.</li>
      <li>Copy the Web app URL Google gives you and paste it into the box in step 2 below, then click <b>Save &amp; connect</b>.</li>
    </ol>
    <textarea readonly rows="10" style="width:100%; font-family:ui-monospace,monospace; font-size:11.5px; padding:10px; border-radius:8px; border:1px solid var(--brand-100); background:var(--brand-25);" id="gasCode">${GAS_CODE.replace(/</g,"&lt;")}</textarea>
    <button class="btn btn-secondary btn-sm" style="margin-top:8px;" onclick="copyGasCode()">Copy script</button>
  </div>`;

  out += `<div class="card pad" style="margin-bottom:14px;">
    <div class="name" style="margin-bottom:8px;">2. Connect Internship Bridge to that Web App</div>
    <div class="field"><label class="field-label">Google Apps Script Web App URL</label>
      <input type="text" id="gas_url" value="${url}" placeholder="https://script.google.com/macros/s/xxxxx/exec"/>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="saveCloudSyncUrl()">Save &amp; connect</button>
      <button class="btn btn-secondary" onclick="pushToDrive(false)">Push data to Drive now</button>
      <button class="btn btn-secondary" onclick="confirmPullFromDrive()">Pull latest from Drive</button>
    </div>
  </div>`;

  out += `<div class="card pad">
    <div class="name" style="margin-bottom:6px;">Status</div>
    <div style="font-size:13px;">Connection: ${url ? badge("APPROVED","good") : badge("NOT_STARTED")}
      ${status==="error" ? badge("REJECTED","bad") : ""}</div>
    <div class="muted" style="margin-top:6px; font-size:12.5px;">Last synced to Drive: ${lastSynced}</div>
    <div class="muted" style="margin-top:4px; font-size:12.5px;">Every time a record is created or edited anywhere in the app, the full dataset is automatically pushed to this file a moment later. Local storage always keeps a working copy too, so the app still works if Drive is briefly unreachable.</div>
  </div>`;
  return out;
}
function copyGasCode(){
  const ta = document.getElementById("gasCode");
  ta.select();
  document.execCommand && document.execCommand("copy");
  navigator.clipboard && navigator.clipboard.writeText(GAS_CODE).catch(()=>{});
  toast("Script copied — paste it into script.google.com.");
}
function saveCloudSyncUrl(){
  const url = document.getElementById("gas_url").value.trim();
  mutate(db=>{
    ensureSettings(db);
    db.settings.cloudSyncUrl = normalizeSyncUrl(url);
  });
  if(url){
    toast("Saved. Connecting to Google Drive…");
    pushToDrive(false);
  } else {
    toast("Cloud sync URL cleared.");
  }
}
function confirmPullFromDrive(){
  if(!confirm("This replaces everything currently in the app with whatever is saved in your Google Drive file. Continue?")) return;
  pullFromDrive(false);
}
window.saveCloudSyncUrl = saveCloudSyncUrl;
window.pushToDrive = pushToDrive;
window.confirmPullFromDrive = confirmPullFromDrive;
window.copyGasCode = copyGasCode;

/* ---------------------------- Faculty: Assigned Interns ---------------------------- */
function renderFacultyInterns(user){
  const internships = myInternships(user);
  let out = pageHeader("University Supervisor Portal","Assigned Interns", "",
    "Review the company supervisor's evaluation feedback for each intern, then submit your own final marks — these are recorded on the student's record and are visible to the Industry Liaison Office in Reports.");
  if(internships.length===0){ out += `<div class="card">${emptyState("No interns assigned yet")}</div>`; return out; }

  out += internships.map(i=>{
    const s=studentById(i.studentId), u=userById(s.userId), c=companyById(i.companyId), p=postingById(i.postingId);
    const expanded = VIEW.params.expanded===i.id;
    const visits = DB.siteVisits.filter(v=>v.internshipId===i.id);
    const evals = DB.evaluations.filter(e=>e.internshipId===i.id && e.status==="SUBMITTED" && !isFacultyEval(e.type)).sort((a,b)=>a.type==="MIDTERM"?-1:1);
    const facultyMid = DB.evaluations.find(e=>e.internshipId===i.id && e.type==="FACULTY");
    const facultyFinal = DB.evaluations.find(e=>e.internshipId===i.id && e.type==="FACULTY_FINAL");
    const facultyLocked = i.facultyAssessedAt != null;
    return `<div class="card pad">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div><div class="name">${u.name}</div><div class="muted">${c.name} · ${p.title}</div></div>
        <div style="display:flex; gap:10px; align-items:center;">${badge(i.status)}${i.facultyGrade?badge("Marks: "+i.facultyScore+"/100 · "+i.facultyGrade,"good"):""}<button class="btn btn-ghost btn-sm" onclick="goto('facultyInterns',{expanded:'${expanded?'':i.id}'})">${expanded?'Hide':'Manage'}</button></div>
      </div>
      ${expanded ? `<div class="divider"></div>
        <div class="row" style="margin-bottom:14px;">
          <div class="field"><label class="field-label">Schedule a site visit</label><input type="datetime-local" id="visit_${i.id}"/></div>
          <button class="btn btn-secondary" onclick="scheduleVisit('${i.id}')">Schedule</button>
        </div>
        ${visits.map(v=>`<div class="card pad" style="margin-bottom:8px;">
          <div style="display:flex; justify-content:space-between;"><span style="font-size:13px;">${fmtDateTime(v.scheduledDate)}</span>${badge(v.status)}</div>
          ${v.status==="SCHEDULED" ? `<div class="row" style="margin-top:8px;">
            <input type="text" style="flex:1;" placeholder="Observations..." id="obs_${v.id}"/>
            <button class="btn btn-secondary btn-sm" onclick="completeVisit('${v.id}')">Mark complete</button>
          </div>` : (v.observations ? `<div class="muted" style="margin-top:6px;">${v.observations}</div>` : "")}
        </div>`).join("")}

        <div class="name" style="margin:14px 0 8px;">Company supervisor evaluation feedback</div>
        ${evals.length===0 ? `<div class="card">${emptyState("No employer evaluations submitted yet","The company supervisor's midterm/final evaluation will appear here once submitted.")}</div>` :
          evals.map(e=>`<div class="card pad" style="margin-bottom:8px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div class="name">${e.type==="MIDTERM"?"Midterm evaluation":"Final evaluation"}</div>
              ${badge(e.status)}
            </div>
            <div class="grid grid-3" style="margin-top:8px;">
              <div class="kv"><span class="muted">Score:</span><br><b>${e.totalScore}/${e.maxScore}</b></div>
              <div class="kv"><span class="muted">Marks:</span><br><b>${e.marks!=null?`${e.marks}/100 (${e.markGrade})`:"—"}</b></div>
              <div class="kv"><span class="muted">Overall assessment:</span><br><b>${e.overallGrade||"—"}</b></div>
              <div class="kv"><span class="muted">Recommend for employment:</span><br><b>${e.recommendToHire===null?"—":(e.recommendToHire?"Yes":"No")}</b></div>
            </div>
            ${e.strengths?`<div style="margin-top:8px; font-size:13px;"><span class="muted">Strengths:</span> ${e.strengths}</div>`:""}
            ${e.areasForImprovement?`<div style="margin-top:4px; font-size:13px;"><span class="muted">Areas for improvement:</span> ${e.areasForImprovement}</div>`:""}
            ${e.additionalComments?`<div style="margin-top:4px; font-size:13px;"><span class="muted">Additional comments:</span> ${e.additionalComments}</div>`:""}
          </div>`).join("")}

        <div class="name" style="margin:14px 0 8px;">University supervisor evaluation questionnaires</div>
        <div class="subtext" style="margin-bottom:8px;">Just like the company supervisor, you mark a midterm and a final evaluation on the same 20-question, 5-point Likert rubric.</div>
        ${[["FACULTY","Midterm evaluation",facultyMid],["FACULTY_FINAL","Final evaluation",facultyFinal]].map(([t,label,fe])=>`
          <div class="card pad" style="margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:12px;">
            <div>
              <div class="name">${label}</div>
              ${fe
                ? `<div class="kv"><span class="muted">Status:</span> ${badge(fe.status)} ${fe.status==="SUBMITTED"?`<span style="margin-left:8px;">Score: <b>${fe.totalScore}/${fe.maxScore}</b>${fe.marks!=null?` · Marks: <b>${fe.marks}/100 (${fe.markGrade})</b>`:""}${fe.overallGrade?` · Grade: <b>${fe.overallGrade}</b>`:""}</span>`:""}</div>`
                : `<div class="muted">Not started yet.</div>`}
            </div>
            <button class="btn btn-secondary" onclick="goto('evaluate',{internshipId:'${i.id}', type:'${t}'})">${fe&&fe.status==="SUBMITTED"?"View":(fe?"Continue":"Fill")} questionnaire</button>
          </div>`).join("")}

        <div class="name" style="margin:14px 0 8px;">Faculty (university supervisor) final assessment</div>
        <div class="card pad">
          <div class="row">
            <div class="field" style="flex:1;"><label class="field-label">Faculty marks (out of 100)</label><input type="number" min="0" max="100" id="fa_score_${i.id}" value="${i.facultyScore??''}" ${facultyLocked?"disabled":""}/></div>
            <div class="field" style="flex:1;"><label class="field-label">Grade</label>
              <select id="fa_grade_${i.id}" ${facultyLocked?"disabled":""}>
                <option value="">—</option>
                ${GRADE_OPTIONS.map(g=>`<option value="${g}" ${i.facultyGrade===g?'selected':''}>${g}</option>`).join("")}
              </select>
            </div>
          </div>
          <div class="field"><label class="field-label">Comments</label><textarea id="fa_comments_${i.id}" rows="2" ${facultyLocked?"disabled":""}>${i.facultyComments||''}</textarea></div>
          ${facultyLocked
            ? `<div style="display:flex; justify-content:space-between; align-items:center;">
                <div class="muted">Submitted ${fmtDateTime(i.facultyAssessedAt)} — visible to the Industry Liaison Office in Reports.</div>
                <button class="btn btn-secondary btn-sm" onclick="unlockAssessment('${i.id}')">Edit</button>
              </div>`
            : `<button class="btn btn-primary" onclick="submitAssessment('${i.id}')">Submit final marks</button>`}
        </div>
      ` : ""}
    </div>`;
  }).join("");
  return out;
}
function scheduleVisit(internshipId){
  const date = document.getElementById("visit_"+internshipId).value;
  if(!date){ toast("Choose a date/time first."); return; }
  mutate(db=>{
    db.siteVisits.push({ id: uid("visit"), internshipId, facultyUserId: currentUser().id, scheduledDate: date, status:"SCHEDULED", observations:"" });
    const i = internshipById(internshipId), s = studentById(i.studentId);
    notify(s.userId, "VISIT_REMINDER", "Supervisor site visit scheduled", `Your university supervisor has scheduled a site visit for ${fmtDateTime(date)}.`);
  });
  toast("Site visit scheduled.");
}
function completeVisit(visitId){
  const obs = document.getElementById("obs_"+visitId)?.value || "";
  mutate(db=>{ const v=db.siteVisits.find(x=>x.id===visitId); v.status="COMPLETED"; v.observations=obs; });
  toast("Visit marked complete.");
}
function submitAssessment(internshipId){
  const scoreEl = document.getElementById("fa_score_"+internshipId);
  const score = Number(scoreEl.value);
  const grade = document.getElementById("fa_grade_"+internshipId).value;
  const comments = document.getElementById("fa_comments_"+internshipId).value;
  if(!scoreEl.value || isNaN(score) || score<0 || score>100){ toast("Please enter faculty marks between 0 and 100."); return; }
  mutate(db=>{
    const i = db.internships.find(x=>x.id===internshipId);
    i.facultyScore = score;
    i.facultyGrade = grade || null;
    i.facultyComments = comments;
    i.facultyAssessedAt = nowISO();
    i.grade = grade || i.grade; // reflected as the internship's overall grade
    const s = studentById(i.studentId);
    notify(s.userId, "GENERAL", "Final marks recorded", `Your university supervisor has recorded your final internship marks: ${score}/100${grade?` (${grade})`:""}.`);
    const liaisons = db.users.filter(u=>u.role==="LIAISON_OFFICER"||u.role==="HOD");
    liaisons.forEach(l=>notify(l.id, "GENERAL", "Faculty marks submitted", `${currentUser().name} submitted final marks (${score}/100${grade?`, ${grade}`:""}) for ${s?userById(s.userId).name:"a student"}.`));
  });
  toast(`Faculty assessment recorded: ${score}/100 — visible to the Liaison Office.`);
}
function unlockAssessment(internshipId){
  mutate(db=>{ const i=db.internships.find(x=>x.id===internshipId); i.facultyAssessedAt = null; });
}

/* ---------------------------- Boot ---------------------------- */
if(document.readyState === "loading"){ window.addEventListener("DOMContentLoaded", boot); } else { boot(); }

</script>
