<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Internship Bridge — Industry Liaison Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Client-side CV parsing: extract text from PDF / DOCX resumes so ATS-style data can be read
     straight off the uploaded file. Both run entirely in the browser — no file ever leaves it. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
  :root{
    --ink:#12233B;
    --brand-50:#EEF4FA; --brand-100:#D9E6F5; --brand-200:#B3CDEB; --brand-300:#7FA9DA;
    --brand-400:#4C7FC0; --brand-500:#2C5A9C; --brand-600:#1F4478; --brand-700:#193961;
    --brand-800:#152D4B; --brand-900:#0F1B2E;
    --amber:#C9862A; --teal:#1E7C6B; --rose:#B3435A;
    --paper:#F6F4EE;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
  }
  .font-display{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  #app{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:250px; flex-shrink:0; background:var(--brand-900); color:#fff;
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  #sidebar .brand{padding:22px 22px 16px;}
  #sidebar .brand .name{font-family:'Fraunces',serif; font-size:18px; font-weight:600; line-height:1.2;}
  #sidebar .brand .sub{font-size:11px; color:var(--brand-300); margin-top:2px;}
  #sidebar nav{flex:1; padding:0 12px; overflow-y:auto;}
  #sidebar nav a{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 12px; border-radius:6px; font-size:13.5px; color:var(--brand-200);
    text-decoration:none; margin-bottom:2px; cursor:pointer;
  }
  #sidebar nav a:hover{background:rgba(255,255,255,.06); color:#fff;}
  #sidebar nav a.active{background:rgba(255,255,255,.12); color:#fff; font-weight:600;}
  #sidebar nav a .pill{
    background:var(--amber); color:var(--brand-900); font-size:10px; font-weight:700;
    border-radius:99px; padding:1px 7px;
  }
  #sidebar .viewer{border-top:1px solid rgba(255,255,255,.1); padding:16px 22px;}
  #sidebar .viewer label{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--brand-300); display:block; margin-bottom:6px;}
  #sidebar select{
    width:100%; background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.18);
    border-radius:6px; padding:7px 8px; font-size:12.5px;
  }
  #sidebar select option{color:#000;}

  /* ---------- Main ---------- */
  #main{flex:1; overflow-y:auto;}
  #content{max-width:980px; margin:0 auto; padding:34px 36px 80px;}

  .eyebrow{font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--amber); margin-bottom:4px;}
  h1.page-title{font-family:'Fraunces',serif; font-size:26px; font-weight:600; margin:0;}
  .header-row{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
  .subtext{color:var(--brand-500); font-size:13.5px; margin-top:6px; max-width:64ch;}

  .card{background:#fff; border:1px solid var(--brand-100); border-radius:10px;}
  .card + .card{margin-top:12px;}
  .pad{padding:20px;}
  .grid{display:grid; gap:14px;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:720px){ .grid-3,.grid-2{grid-template-columns:1fr;} }

  .stat .label{font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--brand-500);}
  .stat .value{font-family:'Fraunces',serif; font-size:30px; font-weight:600; margin-top:6px;}
  .stat .hint{font-size:11.5px; color:var(--brand-400); margin-top:2px;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border-radius:8px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer;
    border:1px solid transparent; transition:all .12s ease; white-space:nowrap;
  }
  .btn-primary{background:var(--brand-800); color:#fff;}
  .btn-primary:hover{background:var(--brand-700);}
  .btn-secondary{background:#fff; color:var(--brand-800); border-color:var(--brand-200);}
  .btn-secondary:hover{background:var(--brand-50);}
  .btn-danger{background:var(--rose); color:#fff;}
  .btn-danger:hover{opacity:.9;}
  .btn-ghost{background:transparent; color:var(--brand-700);}
  .btn-ghost:hover{background:var(--brand-50);}
  .btn[disabled]{opacity:.45; cursor:not-allowed;}
  .btn-sm{padding:5px 10px; font-size:12px;}

  label.field-label{display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; color:var(--brand-600); margin-bottom:5px;}
  input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=datetime-local],select,textarea{
    width:100%; border:1px solid var(--brand-200); border-radius:7px; padding:8px 10px; font-size:13.5px;
    font-family:inherit; color:var(--ink); background:#fff;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-400); outline-offset:0; border-color:transparent;}
  textarea{resize:vertical;}
  .field{margin-bottom:12px;}
  .row{display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;}

  .badge{display:inline-flex; align-items:center; border-radius:99px; padding:2px 10px; font-size:11px; font-weight:600;}
  .tone-neutral{background:var(--brand-50); color:var(--brand-700);}
  .tone-good{background:rgba(30,124,107,.12); color:var(--teal);}
  .tone-warn{background:rgba(201,134,42,.15); color:var(--amber);}
  .tone-bad{background:rgba(179,67,90,.12); color:var(--rose);}

  .list-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 20px; border-bottom:1px solid var(--brand-50);}
  .list-row:last-child{border-bottom:none;}
  .name{font-weight:600; font-size:13.5px;}
  .muted{color:var(--brand-500); font-size:12.5px;}

  .empty{padding:56px 20px; text-align:center;}
  .empty .t{font-family:'Fraunces',serif; font-size:17px;}
  .empty .h{color:var(--brand-500); font-size:13px; margin-top:6px; max-width:40ch; margin-left:auto; margin-right:auto;}

  .tabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
  .tabs .btn{padding:7px 12px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--brand-500); padding:10px 16px; border-bottom:1px solid var(--brand-100);}
  td{padding:11px 16px; border-bottom:1px solid var(--brand-50);}

  .rating-legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--brand-600); background:var(--brand-50); border-radius:8px; padding:10px 14px; margin-bottom:16px;}
  .rating-legend span{white-space:nowrap;}
  .rating-legend b{color:var(--ink); font-family:'IBM Plex Mono',monospace;}

  .score-grid{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
  .score-opt{
    width:42px; height:42px; border:1px solid var(--brand-200); border-radius:8px; background:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    font-family:'Fraunces',serif; font-size:14px; font-weight:600;
  }
  .score-opt.sel{background:var(--brand-800); border-color:var(--brand-800); color:#fff;}
  .score-opt.locked{cursor:not-allowed; opacity:.75;}

  /* ---------- Likert scale (5-point) ---------- */
  .likert-scale{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .likert-opt{
    flex:1; min-width:96px; border:1px solid var(--brand-200); border-radius:10px; background:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    padding:10px 8px; cursor:pointer; text-align:center;
  }
  .likert-opt .n{font-family:'Fraunces',serif; font-size:15px; font-weight:600;}
  .likert-opt .l{font-size:11px; color:var(--brand-500);}
  .likert-opt.sel{background:var(--brand-800); border-color:var(--brand-800);}
  .likert-opt.sel .n, .likert-opt.sel .l{color:#fff;}
  .likert-opt.locked{cursor:not-allowed; opacity:.75;}

  .toast{
    position:fixed; bottom:22px; right:22px; background:var(--brand-900); color:#fff; padding:12px 18px;
    border-radius:8px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:50; max-width:320px;
  }
  .divider{height:1px; background:var(--brand-100); margin:18px 0;}
  .kv{font-size:13px; color:var(--ink);}
  .kv b{font-weight:600;}
  .lockhint{font-size:10.5px; color:var(--brand-300); margin-top:6px; line-height:1.4;}

  /* ---------- Job Postings / LinkedIn Search ---------- */
  .job-search-bar{display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:18px;}
  .job-search-bar .field{flex:1; min-width:200px; margin-bottom:0;}
  .job-search-bar .btn{height:38px;}
  .job-card{background:#fff; border:1px solid var(--brand-100); border-radius:12px; padding:20px; margin-bottom:12px; transition:box-shadow .15s ease, border-color .15s ease;}
  .job-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.06); border-color:var(--brand-200);}
  .job-card .job-title{font-family:'Fraunces',serif; font-size:16px; font-weight:600; color:var(--ink); margin-bottom:2px;}
  .job-card .job-company{font-size:13.5px; color:var(--brand-500); margin-bottom:6px;}
  .job-card .job-meta{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--brand-400); margin-bottom:10px;}
  .job-card .job-meta span{display:flex; align-items:center; gap:4px;}
  .job-card .job-desc{font-size:13px; color:var(--brand-600); line-height:1.55; margin-bottom:14px;}
  .job-card .job-tags{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .job-card .job-tag{background:var(--brand-50); color:var(--brand-700); font-size:11px; font-weight:600; border-radius:99px; padding:3px 10px;}
  .job-card .job-actions{display:flex; gap:8px; align-items:center;}
  .btn-linkedin{background:#0A66C2; color:#fff; border:none;}
  .btn-linkedin:hover{background:#004182;}
  .btn-apply-job{background:var(--teal); color:#fff; border:none;}
  .btn-apply-job:hover{background:#166a5b;}
  .job-skeleton{background:var(--brand-50); border-radius:12px; padding:20px; margin-bottom:12px; animation:pulse 1.5s infinite;}
  .job-skeleton .sk-line{background:var(--brand-100); border-radius:4px; margin-bottom:10px;}
  .job-skeleton .sk-title{width:60%; height:20px;}
  .job-skeleton .sk-company{width:40%; height:14px;}
  .job-skeleton .sk-desc{width:100%; height:12px;}
  .job-skeleton .sk-desc2{width:80%; height:12px;}
  .job-skeleton .sk-btn{width:100px; height:32px; margin-top:6px;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
  .linkedin-banner{background:linear-gradient(135deg, #0A66C2 0%, #004182 100%); color:#fff; border-radius:12px; padding:18px 22px; margin-bottom:18px; display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .linkedin-banner .li-text{font-size:14px; line-height:1.5;}
  .linkedin-banner .li-text b{font-size:16px; display:block; margin-bottom:2px;}
  .linkedin-badge{display:inline-flex; align-items:center; gap:5px; background:rgba(255,255,255,.15); border-radius:6px; padding:4px 10px; font-size:11px; font-weight:600;}
  .job-filters{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .job-filter-chip{background:#fff; border:1px solid var(--brand-200); border-radius:99px; padding:5px 14px; font-size:12px; font-weight:500; cursor:pointer; transition:all .12s ease;}
  .job-filter-chip:hover{background:var(--brand-50);}
  .job-filter-chip.active{background:var(--brand-800); color:#fff; border-color:var(--brand-800);}
  .job-count{font-size:13px; color:var(--brand-500); margin-bottom:12px;}

  /* ---------- Login screen ---------- */
  #loginScreen{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--brand-900); padding:20px;}
  .login-card{width:100%; max-width:380px; background:#fff; border-radius:14px; padding:32px 30px; box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .login-card .brandmark{font-family:'Fraunces',serif; font-size:20px; font-weight:600; color:var(--ink); margin-bottom:2px;}
  .login-card .brandsub{font-size:12px; color:var(--brand-500); margin-bottom:22px;}
  .login-card .field{margin-bottom:14px;}
  .login-card .btn{width:100%; margin-top:6px; padding:10px 14px;}
  .login-card .err{font-size:12.5px; color:var(--rose); margin-top:10px; min-height:14px;}
  .sidebar-user{padding:2px 0 4px;}
  .sidebar-user .uname{font-size:13.5px; font-weight:600; color:#fff;}
  .sidebar-user .urole{font-size:11px; color:var(--brand-300); margin-top:2px; margin-bottom:10px;}
  .sync-badge{font-size:10.5px; padding:7px 10px; border-radius:8px; margin:2px 0 10px; line-height:1.4;}
  .sync-badge.off{background:rgba(255,255,255,.06); color:var(--brand-300);}
  .sync-badge.syncing{background:rgba(255,200,80,.15); color:#ffcf6b;}
  .sync-badge.ok{background:rgba(80,200,140,.15); color:#7fe3ac;}
  .sync-badge.error{background:rgba(230,90,90,.18); color:#ff9b9b;}

</style>
</head>
<body>
<div id="loginScreen">
  <div class="login-card">
    <div class="brandmark">Internship&nbsp;Bridge</div>
    <div class="brandsub">Industry Liaison Platform &middot; Sign in</div>
    <div class="field"><label class="field-label">Login ID</label><input type="text" id="login_id" placeholder="Email or Registration No." autocomplete="username"/></div>
    <div class="field"><label class="field-label">Password</label><input type="password" id="login_password" autocomplete="current-password" onkeydown="if(event.key==='Enter')attemptLogin()"/></div>
    <button class="btn btn-primary" onclick="attemptLogin()">Log in</button>
    <div class="err" id="login_error"></div>
  </div>
</div>
<div id="app" style="display:none;">
  <aside id="sidebar">
    <div class="brand">
      <div class="name">Internship&nbsp;Bridge</div>
      <div class="sub">Industry Liaison Platform</div>
    </div>
    <nav id="nav"></nav>
    <div class="viewer">
      <div class="sidebar-user">
        <div class="uname" id="viewerName"></div>
        <div class="urole" id="viewerRole"></div>
      </div>
      <button class="btn btn-secondary btn-sm" style="width:100%;" onclick="logout()">Log out</button>
    </div>
  </aside>
  <main id="main">
    <div id="content"></div>
  </main>
</div>

<script>
/* =========================================================================
   INTERNSHIP BRIDGE — single-file demo
   The Industry Liaison Officer acts as the administrator: creates student
   records, employer accounts, and supervisors (faculty + company side),
   setting a login ID and password and assigning each person's role.
   After signing in, every account only sees the tabs for its own role —
   there is no cross-portal switching. All data lives in the browser's
   persistent storage.
   ========================================================================= */

const STORAGE_KEY = "internship-bridge-db-v5";
// Google Apps Script Web App that backs this instance's Google Drive folder
// (https://drive.google.com/drive/folders/1-4CCZyL5a6bewjJ532-4CuUz4MsAArBY).
// Wired in directly so syncing runs automatically with no visible settings UI.
const DEFAULT_CLOUD_SYNC_URL = "https://script.google.com/macros/s/AKfycbxXfmBqS9O7_CWGVkPiMV5F08ghpSnqHp71B7LUKbCQPFbUzNSpAQLH1Bp54rQV9p3NZQ/exec";
// Google hands out two flavours of Web App URL. The domain-scoped one
// (/a/macros/<your-domain>/s/.../exec) forces a Google Workspace login and
// therefore returns an HTML sign-in page to fetch() instead of JSON, which is
// what makes Drive sync silently fail for students on personal accounts.
// Always rewrite it to the public /macros/s/.../exec form.
function normalizeSyncUrl(url){
  if(!url) return "";
  return String(url).trim().replace(/^https:\/\/script\.google\.com\/a\/macros\/[^/]+\/s\//, "https://script.google.com/macros/s/");
}

// Every keyword that defines "this student's domain": their program's default
// keywords, plus whatever they typed as preferred industry, plus any skills
// the CV parser pulled off their uploaded resume.
function studentDomainKeywords(s){
  const kws = new Set();
  (PROGRAM_KEYWORDS[s.program]||[]).forEach(k=>kws.add(k.toLowerCase()));
  if(s.preferredIndustry){
    s.preferredIndustry.split(/[,&/]+/).forEach(t=>{ t=t.trim().toLowerCase(); if(t) kws.add(t); });
  }
  (s.cvSkills||[]).forEach(k=>kws.add(k.toLowerCase()));
  return Array.from(kws).filter(Boolean);
}
function matchesKeywords(text, keywords){
  const t = (text||"").toLowerCase();
  return keywords.some(k=>k && t.includes(k));
}

// Derives the internship mark (out of 100) and letter grade from the total
// Likert score, using the same bands shown in the Suggested Marking Scheme
// table (180-200 -> A, 160-179 -> B+, 140-159 -> B, 120-139 -> C, below 120
// -> Needs Improvement). Marks are scaled proportionally from the score.
function computeMarking(totalScore, maxScore){
  const marks = Math.round((totalScore / maxScore) * 100);
  let grade;
  if(marks>=90) grade="A";
  else if(marks>=80) grade="B+";
  else if(marks>=70) grade="B";
  else if(marks>=60) grade="C";
  else grade="Needs Improvement";
  return { marks, grade };
}

  if(n<=2) return "Poor";
  if(n<=4) return "Fair";
  if(n<=6) return "Satisfactory";
  if(n<=8) return "Good";
  return "Excellent";
}

/* ---------------------------- Persistence ---------------------------- */
if(!window.storage){
  window.storage = {
    async get(k){ const v = localStorage.getItem(k); if(v===null) throw new Error("miss"); return { value:v }; },
    async set(k,v){ localStorage.setItem(k,v); },
  };
}
async function loadDB(){
  let loaded = false;
  // Try the normal persistent store first. Some file:// preview environments
  // isolate or disable localStorage, so keep a per-tab sessionStorage backup.
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value){ DB = JSON.parse(res.value); loaded = true; }
  }catch(e){}
  if(!loaded){
    try{
      const raw = sessionStorage.getItem(STORAGE_KEY);
      if(raw){ DB = JSON.parse(raw); loaded = true; }
    }catch(e){}
  }
  if(!loaded){
    DB = seedDB();
    await saveDB();
  }
  ensureSettings(DB);
}
async function saveDB(){
  const raw = JSON.stringify(DB);
  let saved = false;
  try{ await window.storage.set(STORAGE_KEY, raw, true); saved = true; }catch(e){ console.warn("localStorage save failed", e); }
  // sessionStorage survives F5 in the same browser tab and is especially useful
  // when this app is opened from a local file/preview URL.
  try{ sessionStorage.setItem(STORAGE_KEY, raw); saved = true; }catch(e){ console.warn("sessionStorage save failed", e); }
  if(!saved) console.error("No browser storage available for the app database.");
}

/* ---------------------------- Google Drive Cloud Sync ----------------------------
   Data is saved to the Industry Liaison Office's Google Drive folder
   (https://drive.google.com/drive/folders/1-4CCZyL5a6bewjJ532-4CuUz4MsAArBY)
   through a Google Apps Script Web App that the Liaison Officer / HOD deploys
   once (see the "Cloud Sync" tab for the script and setup steps). Every
   mutate() pushes the latest data to that script; on boot, if a Web App URL
   is configured, the app pulls the Drive copy so the same data follows you
   across browsers/devices. Local storage always keeps a fast, offline-safe
   copy regardless of whether cloud sync is configured. */
let SYNC_TIMER = null;
let SYNC_STATE = "idle"; // idle | syncing | error
function scheduleCloudPush(){
  if(!DB || !DB.settings || !normalizeSyncUrl(DB.settings.cloudSyncUrl)) return;
  clearTimeout(SYNC_TIMER);
  SYNC_TIMER = setTimeout(()=>{ pushToDrive().catch(()=>{}); }, 600);
}
async function pushToDrive(silent){
  const url = normalizeSyncUrl(DB?.settings?.cloudSyncUrl);
  if(!url) return false;
  SYNC_STATE = "syncing";
  updateSyncBadge();
  const payload = JSON.stringify(DB);
  // Two shapes are tried, because it depends on how the Apps Script web app was
  // deployed: a raw JSON body (read via e.postData.contents) and a form field
  // named "payload" (read via e.parameter.payload). Older deployments only
  // accept one of them, so we fall back rather than failing outright.
  const attempts = [
    { headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: payload },
    { body: (()=>{ const f = new URLSearchParams(); f.set("payload", payload); return f; })() },
  ];
  let lastErr = null;
  for(const attempt of attempts){
    try{
      const res = await fetch(url, { method:"POST", redirect:"follow", ...attempt });
      const raw = await res.text();
      if(res.status === 405) throw new Error("The Apps Script web app rejected the save (HTTP 405). Its deployment is missing doPost — open the script, make sure the doPost function from the Cloud Sync page is there, then Deploy \u2192 Manage deployments \u2192 edit \u2192 New version.");
      let json;
      try{ json = JSON.parse(raw); }
      catch(parseErr){
        throw new Error(`Apps Script did not return JSON (HTTP ${res.status}). First 200 chars: ${raw.slice(0,200)}`);
      }
      if(json && json.status === "error") throw new Error(json.message || "Apps Script returned an error");
      DB.settings.lastSyncedAt = nowISO();
      DB.settings.lastSyncStatus = "ok";
      await saveDB();
      SYNC_STATE = "idle";
      updateSyncBadge();
      if(!silent) toast("Saved to Google Drive.");
      return true;
    }catch(e){
      lastErr = e;
    }
  }
  console.error("Cloud push failed:", lastErr?.message || lastErr);
  DB.settings.lastSyncStatus = "error";
  await saveDB();
  SYNC_STATE = "error";
  updateSyncBadge();
  if(!silent) toast(lastErr?.message ? `Drive save failed: ${lastErr.message}` : "Couldn't reach Google Drive — check the Cloud Sync setup.");
  return false;
}
async function pullFromDrive(silent){
  const url = normalizeSyncUrl(DB?.settings?.cloudSyncUrl);
  if(!url) return false;
  SYNC_STATE = "syncing";
  updateSyncBadge();
  try{
    const res = await fetch(`${url}${url.includes("?")?"&":"?"}t=${Date.now()}`, { method:"GET", redirect:"follow" });
    const raw = await res.text();
    let cloud;
    try{ cloud = JSON.parse(raw); }
    catch(parseErr){
      throw new Error(`Apps Script did not return JSON (HTTP ${res.status}). First 200 chars: ${raw.slice(0,200)}`);
    }
    if(!cloud || !Array.isArray(cloud.users)) throw new Error("Drive file is empty or not yet initialized");
    cloud.settings = cloud.settings || {};
    cloud.settings.cloudSyncUrl = url; // keep using this device's configured endpoint
    cloud.settings.lastSyncedAt = nowISO();
    cloud.settings.lastSyncStatus = "ok";
    DB = cloud;
    ensureSettings(DB);
    await saveDB();
    SYNC_STATE = "idle";
    updateSyncBadge();
    if(!silent) toast("Pulled the latest data from Google Drive.");
    return true;
  }catch(e){
    console.error("Cloud pull failed:", e.message || e);
    SYNC_STATE = "error";
    updateSyncBadge();
    if(!silent) toast("Couldn't pull from Google Drive — check the Cloud Sync setup.");
    return false;
  }
}
// Diagnostic helper — run testCloudSync() in the browser DevTools console
// (F12 -> Console) to see exactly why Drive sync is or isn't working.
window.testCloudSync = async function(){
  const url = normalizeSyncUrl(DB?.settings?.cloudSyncUrl);
  console.log("Configured Apps Script URL:", url);
  if(!url){ console.log("No URL configured."); return; }
  try{
    const res = await fetch(url, { method:"GET" });
    const raw = await res.text();
    console.log("HTTP status:", res.status, res.statusText);
    console.log("Raw response (first 500 chars):", raw.slice(0,500));
    try{
      const json = JSON.parse(raw);
      console.log("✅ Parsed as JSON successfully:", json);
    }catch(e){
      console.log("❌ Response is NOT valid JSON — this usually means Google returned a login/permission page instead of your script's output. Check the deployment's 'Who has access' setting is exactly 'Anyone' (not 'Anyone within [your domain]').");
    }
  }catch(e){
    console.log("❌ Network/fetch error (often CORS or the URL being unreachable):", e.message || e);
  }
};
function updateSyncBadge(){
  const el = document.getElementById("syncBadge");
  if(!el) return;
  const url = DB?.settings?.cloudSyncUrl;
  if(!url){ el.textContent = "☁ Drive sync not connected"; el.className = "sync-badge off"; return; }
  if(SYNC_STATE==="syncing"){ el.textContent = "☁ Syncing to Drive…"; el.className = "sync-badge syncing"; return; }
  if(SYNC_STATE==="error" || DB.settings.lastSyncStatus==="error"){ el.textContent = "☁ Drive sync failed"; el.className = "sync-badge error"; return; }
  const t = DB.settings.lastSyncedAt ? new Date(DB.settings.lastSyncedAt).toLocaleTimeString() : "never";
  el.textContent = `☁ Synced to Drive · ${t}`;
  el.className = "sync-badge ok";
}
/* Every STUDENT login always owns a student profile record, so the
   "My Profile" tab exists the moment the account is created — whatever
   route created it (Manage Accounts, Manage Students, or seed data). */
function ensureStudentProfiles(db){
  if(!db.universityJobs) db.universityJobs=[];
  if(!db.universityJobApps) db.universityJobApps=[];
  if(!db.jobApplications) db.jobApplications=[];
  db.users.filter(u=>u.role==="STUDENT").forEach(u=>{
    if(db.students.some(s=>s.userId===u.id)) return;
    db.students.push({ id: uid("s"), userId:u.id, regNo: u.regNo || "", program: u.program || PROGRAM_OPTIONS[0],
      department: u.department || "", semester:null, cgpa:null, preferredIndustry:"", bio:"",
      profileStatus:"APPROVED", cv:false, transcript:false, assignedFacultyId:null, assignedCompanySupervisorId:null });
  });
  // A student record whose account changed role should not linger as a profile.
  db.students.forEach(s=>{ const u = db.users.find(x=>x.id===s.userId); if(u && u.role!=="STUDENT") u.role = u.role; });
}
function ensureSettings(db){
  if(!db.settings) db.settings = { cloudSyncUrl:"", lastSyncedAt:null, lastSyncStatus:"" };
  if(!db.settings.cloudSyncUrl) db.settings.cloudSyncUrl = DEFAULT_CLOUD_SYNC_URL;
  // Upgrade any previously saved domain-scoped URL to the public form.
  db.settings.cloudSyncUrl = normalizeSyncUrl(db.settings.cloudSyncUrl);
  if(db.settings.adzunaAppId===undefined) db.settings.adzunaAppId = "";
  if(db.settings.adzunaAppKey===undefined) db.settings.adzunaAppKey = "";
  if(db.settings.apifyToken===undefined) db.settings.apifyToken = "";
  if(db.settings.apifyActorId===undefined) db.settings.apifyActorId = "";
  if(db.settings.apifyInputTemplate===undefined) db.settings.apifyInputTemplate = '{"searchQuery":"{{keyword}}","location":"{{country}}","maxItems":30}';
  // Per-platform actor IDs — LinkedIn/Indeed/Glassdoor each need a different
  // Apify actor since they're different scrapers. Migrate the old single
  // apifyActorId (from before per-platform support) into "worldwide" so
  // existing setups keep working.
  if(!db.settings.apifyActors) db.settings.apifyActors = { worldwide:"", linkedin:"", indeed:"", glassdoor:"" };
  if(db.settings.apifyActorId && !db.settings.apifyActors.worldwide) db.settings.apifyActors.worldwide = db.settings.apifyActorId;
}

  fn(DB);

}

/* ---------------------------- Boot ---------------------------- */
// Keep the logged-in user across a page refresh (F5 / the browser's refresh
// icon), but ONLY across a refresh — clicking "Log out" clears this and the
// login screen stays put until someone logs in again. Stored as a stable
// identity (id + email/regNo/name) rather than just the id, because a
// Google Drive restore can regenerate ids for the same account.
const SESSION_KEY = "internship-bridge-session-v3";
function writeSession(user){
  try{
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      id: user?.id || null,
      email: (user?.email||"").trim().toLowerCase(),
      regNo: (user?.regNo||"").trim().toLowerCase(),
      name: (user?.name||"").trim().toLowerCase(),
    }));
  }catch(e){}
}
function readSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function clearSession(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
  // Also wipe any stale keys from earlier versions of this app.
  try{ ["internship-bridge-session-v2","ib_session_user_v2","ib_session_user"].forEach(k=>localStorage.removeItem(k)); }catch(e){}
}
function findUserBySession(saved){
  if(!saved || !DB?.users) return null;
  let u = null;
  if(saved.id) u = DB.users.find(x=>String(x.id)===String(saved.id));
  if(!u && saved.email) u = DB.users.find(x=>(x.email||"").trim().toLowerCase()===saved.email);
  if(!u && saved.regNo){
    const st = DB.students.find(x=>(x.regNo||"").trim().toLowerCase()===saved.regNo);
    if(st) u = DB.users.find(x=>String(x.id)===String(st.userId));
  }
  if(!u && saved.name) u = DB.users.find(x=>(x.name||"").trim().toLowerCase()===saved.name);
  return u || null;
}
async function boot(){
  try{ if((window.name||"").startsWith("IBSESSION")) window.name = ""; }catch(e){}
  await loadDB();
  // Pull Drive before resolving the session — a cloud copy can contain the
  // same account under a different generated id, which findUserBySession()
  // also matches on via email/regNo/name.
  if(DB?.settings?.cloudSyncUrl){ const pulled=await pullFromDrive(true); if(!pulled) pushToDrive(true).catch(()=>{}); }
  ensureStudentProfiles(DB);
  DB.internships.forEach(i=>syncInternshipLinks(DB,i.id));
  await saveDB();
  startLiveJobsAutoRefresh();
  const savedUser = findUserBySession(readSession());
  if(savedUser) enterApp(savedUser); else renderLogin();
}

  VIEWER_ID=user.id;

  document.getElementById("loginScreen").style.display="none";

async function attemptLogin(){
  const idVal = (document.getElementById("login_id").value || "").trim().toLowerCase();
  const pwVal = document.getElementById("login_password").value || "";
  const errEl = document.getElementById("login_error");
  if(!idVal || !pwVal){ errEl.textContent = "Please enter both a login ID and password."; return; }
  let user = DB.users.find(u => (u.email||"").trim().toLowerCase() === idVal);
  if(!user){ const stuMatch = DB.students.find(s => (s.regNo||"").trim().toLowerCase() === idVal); if(stuMatch) user = DB.users.find(u => u.id === stuMatch.userId); }
  if(!user || user.password !== pwVal){
    errEl.textContent = "Incorrect login ID or password.";
    return;
  }
  errEl.textContent = "";
  document.getElementById("login_id").value = "";
  document.getElementById("login_password").value = "";
  // Persist the current database before entering the app. This prevents a
  // refresh from falling back to seedDB when local/cloud storage is delayed.
  await saveDB();
  enterApp(user);
}

}

    case "tagged": html = renderTaggedStudents(user); break;
    case "evaluate": html = renderEvaluationForm(user, VIEW.params.internshipId, VIEW.params.type); break;

    case "accounts": html = renderManageAccounts(user); break;
    case "students": html = renderManageStudents(user); break;
    case "companies": html = renderManageCompanies(user); break;
    case "supervisors": html = renderManageSupervisors(user); break;
    case "matching": html = renderMatching(user); break;
    case "criteria": html = renderCriteria(user); break;
    case "reports": html = renderReports(user); break;
    case "sync": html = renderCloudSync(user); break;

    case "facultyInterns": html = renderFacultyInterns(user); break;
    case "feedback": html = renderFeedbackSurveys(user); break;

    default: html = renderDashboard(user);
  }
  el.innerHTML = html;
}

function liaisonDashboard(user, isHod){
  const totalStudents = DB.students.length;

  const activeCompanies = DB.companies.filter(c=>c.approvalStatus==="APPROVED").length;

  const facultyMarksIn = DB.internships.filter(i=>i.facultyAssessedAt!=null).length;

  let out = isHod
    ? pageHeader("Head of Department","Dashboard",
        "", "Full oversight view — you can see every student, employer, supervisor, and evaluation record in the system.")
    : pageHeader("Industry Liaison Office · Administrator","Dashboard",

    ${statCard("Total students", totalStudents)}
    ${statCard("Students placed", placed)}
    ${statCard("Awaiting placement", Math.max(totalStudents-placed,0))}
    ${statCard("Active companies", activeCompanies)}
    ${statCard("Completion rate", rate+"%")}
    ${statCard("Pending employer responses", pendingResponses)}
    ${statCard("Faculty marks recorded", `${facultyMarksIn}/${DB.internships.length}`)}
  </div>`;

  out += `<div class="card pad" style="margin-top:16px;"><div class="name" style="margin-bottom:10px;">Internship status breakdown</div>`;

  Object.entries(breakdown).forEach(([status,count])=>{

    out += `<div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
      <div style="width:150px; font-size:12.5px; color:var(--brand-500);">${status.replaceAll("_"," ")}</div>

  });
  out += `</div>`;
  return out;
}

/* ---- CV parsing (ATS-style auto-fill) ----
   Runs entirely in the browser: extracts raw text from the uploaded PDF/DOCX
   using pdf.js / mammoth.js (loaded in <head>), then pulls out an email,
   phone number, and any recognizable skill/domain keywords. Nothing is sent
   anywhere — the file never leaves the browser tab. */
if(typeof pdfjsLib !== "undefined"){
  try{ pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }catch(e){}
}
async function extractTextFromFile(file){
  const name = (file.name||"").toLowerCase();
  if(name.endsWith(".pdf") || file.type==="application/pdf"){
    if(typeof pdfjsLib==="undefined") throw new Error("PDF reader failed to load");
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let text = "";
    for(let i=1;i<=pdf.numPages;i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(it=>it.str).join(" ") + "\n";
    }
    return text;
  }
  if(name.endsWith(".docx")){
    if(typeof mammoth==="undefined") throw new Error("DOCX reader failed to load");
    const buf = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer: buf });
    return result.value || "";
  }
  if(name.endsWith(".doc")){
    throw new Error("legacy .doc can't be auto-read in-browser — upload PDF or DOCX for auto-fill");
  }
  return await file.text();
}
function extractFieldsFromText(text){
  const emailMatch = text.match(/[\w.+-]+@[\w-]+\.[\w.-]+/);
  const phoneMatch = text.match(/(\+?\d[\d\s\-()]{7,}\d)/);
  const lower = text.toLowerCase();
  const vocab = new Set(CV_SKILL_VOCAB);
  Object.values(PROGRAM_KEYWORDS).forEach(list=>list.forEach(k=>vocab.add(k)));
  const skills = Array.from(vocab).filter(k=>lower.includes(k));
  return {
    email: emailMatch ? emailMatch[0] : null,
    phone: phoneMatch ? phoneMatch[0].trim() : null,
    skills,
  };
}
async function parseAndApplyCV(sid, file){
  toast("Reading your CV for auto-fill…");
  try{
    const text = await extractTextFromFile(file);
    const { email, phone, skills } = extractFieldsFromText(text);
    await mutate(db=>{
      const s = db.students.find(x=>x.id===sid);
      s.cvSkills = skills;
      s.cvEmail = email;
      s.cvPhone = phone;
      s.cvParsedAt = nowISO();
      const u = db.users.find(x=>x.id===s.userId);
      if(u && !u.email && email) u.email = email;
      if(!s.preferredIndustry && skills.length){
        const ranked = Object.entries(PROGRAM_KEYWORDS)
          .map(([prog,list])=>({ prog, hits: skills.filter(k=>list.includes(k)) }))
          .sort((a,b)=>b.hits.length-a.hits.length);
        if(ranked[0] && ranked[0].hits.length) s.preferredIndustry = ranked[0].hits.slice(0,3).join(", ");
      }
    });
    toast(skills.length
      ? `CV parsed — found ${skills.length} skill keyword(s) (${skills.slice(0,4).join(", ")}${skills.length>4?"…":""}), now used to match jobs to your domain.`
      : "CV parsed, but no recognizable skill keywords were found in it.");
  }catch(e){
    console.error(e);
    toast("File uploaded, but couldn't auto-read its contents (" + (e.message||"parsing error") + ").");
  }
}
function handleFileUpload(sid, field, inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const maxBytes = 2 * 1024 * 1024;
  if(file.size > maxBytes){
    toast("That file is too large — please upload something under 2MB.");
    inputEl.value = "";
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    mutate(db=>{
      const s = db.students.find(x=>x.id===sid);
      s[field] = true;
      s[field+"File"] = { name: file.name, type: file.type, dataUrl: reader.result, uploadedAt: nowISO() };
    });
    toast(`${file.name} uploaded.`);
    if(field==="cv") parseAndApplyCV(sid, file);
  };
  reader.onerror = () => toast("Couldn't read that file — please try again.");
  reader.readAsDataURL(file);
  inputEl.value = "";
}
function downloadStudentFile(sid, field){
  const s = DB.students.find(x=>x.id===sid);
  const f = s && s[field+"File"];
  if(!f) return;
  const link = document.createElement("a");
  link.href = f.dataUrl;
  link.download = f.name;
  document.body.appendChild(link);
  link.click();
  link.remove();
}
function removeStudentFile(sid, field){
  mutate(db=>{
    const s = db.students.find(x=>x.id===sid);
    s[field] = false;
    s[field+"File"] = null;
    if(field==="cv"){ s.cvSkills=[]; s.cvEmail=null; s.cvPhone=null; s.cvParsedAt=null; }
  });
  toast("File removed.");
}
function downloadATSTemplate(){
  const link = document.createElement("a");
  link.href = "data:application/vnd.openxmlformats-officedocument.wordprocessingml.document;base64," + ATS_CV_TEMPLATE_B64;
  link.download = "ATS_CV_Template.docx";
  document.body.appendChild(link);
  link.click();
  link.remove();
}

function renderBrowse(user){

  const showAll = !!VIEW.params.showAllPostings;
  const allOpen = DB.postings.filter(p=>p.isOpen && companyById(p.companyId).approvalStatus==="APPROVED");

    const c = companyById(p.companyId);
    return matchesKeywords(`${p.title} ${p.department} ${p.description} ${c.industry}`, keywords);

  const hiddenCount = allOpen.length - openPostings.length;

  }
  if(openPostings.length===0){ out += `<div class="card">${emptyState(keywords.length>0&&!showAll?"No open postings in your domain right now":"No open postings right now","Try \"Show all postings\" above, or check back soon.")}</div>`; return out; }

  out += openPostings.map(p=>{
    const c = companyById(p.companyId);
    const already = DB.applications.some(a=>a.studentId===s.id && a.postingId===p.id);
    return `<div class="card pad">
      <div style="display:flex; justify-content:space-between;">
        <div><div class="name" style="font-size:16px; font-family:'Fraunces',serif;">${p.title}</div><div class="muted">${c.name} · ${c.industry}</div></div>
        <div class="muted">${p.positions} position(s)</div>

      }
    </div>`;
  }).join("");

function jobPathSlug(value){
  return (value||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
function jobPathTitle(value){
  return (value||"").trim().split(/\s+/).map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join("%20");

const ROZEE_CITY_IDS = {
  lahore:"1185", karachi:"1184", islamabad:"1180", rawalpindi:"1190",
  faisalabad:"1181", gujranwala:"1182", hyderabad:"1183", multan:"1187",

};
function mustakbilFieldSlug(value){
  const v=(value||"").toLowerCase();
  if(/digital marketing|seo|social media|content marketing/.test(v)) return "digital-marketing";
  if(/software|developer|programming|web development|computer/.test(v)) return "computer-software";
  if(/information technology|\bit\b|network|cyber|data|analytics/.test(v)) return "information-technology";
  if(/account|audit|finance|banking|tax/.test(v)) return "accounting";
  if(/human resource|\bhr\b|recruit|talent/.test(v)) return "human-resources";
  if(/sales|business development/.test(v)) return "sales";
  if(/graphic|ui.?ux|design|creative/.test(v)) return "graphic-design";
  if(/supply chain|logistics|procurement/.test(v)) return "supply-chain";
  if(/engineer/.test(v)) return "engineer";
  if(/education|teacher|teaching/.test(v)) return "education";
  if(/admin|office/.test(v)) return "administrative";
  return "";
}

function platformSearchURL(platform, keyword, countryName, locationText){
  const k = encodeURIComponent(keyword||"internship");
  const country = countryByName(countryName || JOB_SEARCH_STATE.country);
  const isWorldwide = country.name === "Worldwide / Remote";
  const selectedLocation = (locationText || "").trim() || (isWorldwide ? "" : country.name);
  if(platform==="linkedin"){
    // LinkedIn's own search accepts a free-text location param — no API/key needed.
    const loc = selectedLocation ? `&location=${encodeURIComponent(selectedLocation)}` : "";
    return `https://www.linkedin.com/jobs/search/?keywords=${k}${loc}&f_TPR=r604800`;
  }
  if(platform==="indeed"){
    // Indeed runs a separate ccTLD subdomain per country (uk.indeed.com, de.indeed.com, ...).
    const sub = isWorldwide ? "www" : country.indeed;
    const l = selectedLocation ? `&l=${encodeURIComponent(selectedLocation)}` : "";
    return `https://${sub}.indeed.com/jobs?q=${k}${l}`;
  }
  if(platform==="glassdoor"){
    // Glassdoor's internal location IDs aren't guessable per-country, so we
    // fall back to its generic keyword search and fold the country name into
    // the query text when one is picked, letting Glassdoor's own geo-match handle it.
    const q = selectedLocation ? encodeURIComponent(`${keyword||"internship"} ${selectedLocation}`) : k;
    return `https://www.glassdoor.com/Job/jobs.htm?sc.keyword=${q}`;
  }
  if(platform==="rozee"){
    const cityName = (locationText||"").trim().toLowerCase();
    const cityId = ROZEE_CITY_IDS[cityName];
    // Rozee uses /fc/<numeric city id> for its native city filter. When the
    // city is not in the verified mapping, keep it in the keyword query so it
    // still affects results instead of silently being discarded.
    const terms = cityId ? (keyword||"internship") : [keyword||"internship", cityName].filter(Boolean).join(" ");
    return `https://www.rozee.pk/job/jsearch/q/${encodeURIComponent(terms)}${cityId?`/fc/${cityId}`:""}`;
  }
  if(platform==="mustakbil"){
    // Mustakbil's query endpoint can show an external-navigation interstitial.
    // Its stable public result pages encode city, work type and field in the
    // path, e.g. /lahore/internship/digital-marketing.
    const city = jobPathSlug(locationText);
    let rawField = (JOB_SEARCH_STATE.keyword || (JOB_SEARCH_STATE.industry!=="All" ? JOB_SEARCH_STATE.industry : "") || keyword || "").toLowerCase();
    let type = JOB_SEARCH_STATE.type!=="All" ? JOB_SEARCH_STATE.type.toLowerCase() : "";
    if(!type && /\b(intern|internship|internships)\b/.test(rawField)) type="internship";
    else if(!type && /\bpart[ -]?time\b/.test(rawField)) type="part-time";
    else if(!type && /\b(remote|online)\b/.test(rawField)) type="online";
    else if(!type && /\bfull[ -]?time\b/.test(rawField)) type="full-time";
    type = type.replace(/^remote$/,"online").replace(/^intern(ship)?s?$/,"internship");
    rawField = rawField.replace(/\b(intern|internship|internships|part[ -]?time|full[ -]?time|remote|online|paid|unpaid|jobs?)\b/g," ").replace(/\s+/g," ").trim();
    const field = mustakbilFieldSlug(`${rawField} ${JOB_SEARCH_STATE.industry!=="All"?JOB_SEARCH_STATE.industry:""}`);
    if(!["internship","part-time","online","full-time"].includes(jobPathSlug(type))) type="";
    const parts = ["https://www.mustakbil.com/jobs/pakistan", city, jobPathSlug(type), field].filter(Boolean);
    return parts.join("/");
  }
  if(platform==="brightspyre"){
    return `https://resume.brightspyre.com/jobs?q=${encodeURIComponent(keyword||"internship")}&location=${encodeURIComponent((locationText||"").trim())}`;
  }
  if(platform==="jobzpk"){
    const role = jobPathSlug(keyword||"internship") || "internship";
    const city = jobPathSlug(locationText);
    return `https://www.jobz.pk/${role}-jobs${city?`-in-${city}`:""}/`;
  }
  if(platform==="pakjobsbank"){
    const city = jobPathTitle(locationText);
    const base = city ? `https://www.pakistanjobsbank.com/Loc/${city}/` : "https://www.pakistanjobsbank.com/";
    return `${base}?q=${encodeURIComponent(keyword||"internship")}`;
  }
  if(platform==="njp"){
    const loc = (locationText||"").trim();
    return `https://www.njp.gov.pk/jobs/live?q=${encodeURIComponent(keyword||"internship")}&location=${encodeURIComponent(loc)}`;
  }
  if(platform==="google"){
    // Google has no free, keyless public API for job listings, so this opens
    // Google's own live search results (often surfacing the "Google for Jobs"
    // panel) for the query — a real page, not scraped/fabricated data.
    const q = selectedLocation ? `${keyword||"internship"} jobs in ${selectedLocation}` : `${keyword||"internship"} jobs`;
    return `https://www.google.com/search?q=${encodeURIComponent(q)}`;
  }
  if(platform==="bayt"){
    const q = encodeURIComponent([keyword||"internship", selectedLocation].filter(Boolean).join(" "));
    return `https://www.bayt.com/en/international/jobs/?keyword=${q}`;
  }
  if(platform==="monster"){
    const where = selectedLocation ? `&where=${encodeURIComponent(selectedLocation)}` : "";
    return `https://www.monster.com/jobs/search?q=${k}${where}`;
  }
  return "#";
}

      // Remotive tags each listing with the countries/regions candidates may apply from —
      // this is what makes country filtering meaningful for this source.
      location: raw.candidate_required_location || "Remote / Worldwide",
      tags: Array.isArray(raw.tags) ? raw.tags : (raw.category ? [raw.category] : []),
      description: (raw.description || "").replace(/<[^>]+>/g," ").slice(0,220),
      url: raw.url || "#",
      posted: raw.publication_date ? fmtDate(raw.publication_date) : "",
      source: "Remotive",
    }),
  },
];
/* Optional extra source: Adzuna genuinely indexes country-specific job boards
   (not just remote roles), but requires a free personal app_id/app_key from
   https://developer.adzuna.com — there's no public keyless endpoint, and we
   can't ship a shared key in client-side code (it would be exposed to every
   visitor and breach Adzuna's terms). When the user pastes their own key in
   Advanced settings below, it's included as one more live source. */
function adzunaSource(country, keyword){
  const cc = country.adzuna;
  const appId = DB?.settings?.adzunaAppId, appKey = DB?.settings?.adzunaAppKey;
  if(!cc || !appId || !appKey) return null;
  const q = encodeURIComponent(keyword || "internship");
  return {
    name: "Adzuna",
    url: `https://api.adzuna.com/v1/api/jobs/${cc}/search/1?app_id=${encodeURIComponent(appId)}&app_key=${encodeURIComponent(appKey)}&results_per_page=30&what=${q}&content-type=application/json`,
    parseList: (data)=> Array.isArray(data?.results) ? data.results : [],
    normalize: (raw)=>({
      id: "adzuna_"+(raw.id || raw.redirect_url || Math.random()),
      title: raw.title || "Untitled role",
      company: raw.company?.display_name || "Unknown company",
      location: raw.location?.display_name || country.name,
      tags: raw.category?.label ? [raw.category.label] : [],
      description: (raw.description || "").replace(/<[^>]+>/g," ").slice(0,220),
      url: raw.redirect_url || "#",
      posted: raw.created ? fmtDate(raw.created) : "",
      source: "Adzuna",
    }),
  };
}
/* Optional extra source: Apify. Unlike the sites we can't reach directly
   (LinkedIn/Indeed/Glassdoor block cross-origin browser requests), Apify's
   own API is a normal CORS-friendly JSON endpoint — Apify's servers do the
   actual scraping and hand you back JSON. Needs your own free token from
   https://console.apify.com/account/integrations, plus the ID of an Apify
   "Actor" you've chosen (search the Apify Store for e.g. "LinkedIn Jobs
   Scraper" or "Indeed Scraper" and copy its actor ID, like
   "curious_coder/linkedin-jobs-scraper"). Note: some of these actors scrape
   sites in ways that may violate that site's own terms of service — that's
   between you and Apify/the target site, not something this app enforces. */
function apifySource(country, keyword, platformKey){
  const token = DB?.settings?.apifyToken;
  const actorId = DB?.settings?.apifyActors?.[platformKey||"worldwide"] || (platformKey==="worldwide" ? DB?.settings?.apifyActorId : "");
  if(!token || !actorId) return null;
  let bodyStr = DB?.settings?.apifyInputTemplate || '{"searchQuery":"{{keyword}}","location":"{{country}}","maxItems":30}';
  bodyStr = bodyStr
    .replace(/\{\{keyword\}\}/g, (keyword||"internship").replace(/"/g,'\\"'))
    .replace(/\{\{country\}\}/g, (country.name==="Worldwide / Remote" ? "" : country.name).replace(/"/g,'\\"'));
  const encodedActor = actorId.replace("/", "~");
  return {
    name: "Apify",
    method: "POST",
    body: bodyStr,
    url: `https://api.apify.com/v2/acts/${encodedActor}/run-sync-get-dataset-items?token=${encodeURIComponent(token)}`,
    parseList: (data)=> Array.isArray(data) ? data : [],
    // Actor output schemas vary a lot, so this reads several common field
    // names rather than assuming one fixed shape.
    normalize: (raw)=>({
      id: "apify_"+(raw.id || raw.jobUrl || raw.link || raw.url || Math.random()),
      title: raw.title || raw.positionName || raw.jobTitle || "Untitled role",
      company: raw.company || raw.companyName || raw.company_name || "Unknown company",
      location: raw.location || raw.jobLocation || raw.place || country.name,
      tags: Array.isArray(raw.tags) ? raw.tags : (Array.isArray(raw.skills) ? raw.skills : []),
      description: String(raw.description || raw.descriptionText || "").replace(/<[^>]+>/g," ").slice(0,220),
      url: raw.link || raw.jobUrl || raw.url || raw.applyUrl || "#",
      posted: raw.datePosted || raw.postedAt || raw.date || "",
      source: "Apify",
    }),
  };
}
async function searchWorldwideJobs(){
  WORLDWIDE_JOBS_STATE = { status:"loading", jobs:[], error:null };
  render();
  const country = countryByName(JOB_SEARCH_STATE.country);
  const extras = [adzunaSource(country, JOB_SEARCH_STATE.keyword), apifySource(country, JOB_SEARCH_STATE.keyword, "worldwide")].filter(Boolean);
  const sources = [...WORLDWIDE_JOB_SOURCES, ...extras];
  const results = await Promise.allSettled(sources.map(async src=>{
    const res = await fetch(src.url, src.method ? { method:src.method, headers:{"Content-Type":"application/json"}, body:src.body } : undefined);
    if(!res.ok) throw new Error(src.name+" HTTP "+res.status);
    const data = await res.json();
    return src.parseList(data).map(src.normalize);
  }));
  let jobs = [];
  const failedSources = [];
  results.forEach((r, idx)=>{
    if(r.status==="fulfilled") jobs = jobs.concat(r.value);
    else failedSources.push(sources[idx].name);
  });
  // De-dupe roughly across sources by title+company.
  const seen = new Set();
  jobs = jobs.filter(j=>{
    const key = (j.title+"|"+j.company).toLowerCase();
    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  if(jobs.length===0 && failedSources.length===sources.length){
    WORLDWIDE_JOBS_STATE = { status:"error", jobs:[], error: "Every source failed to respond (network/CORS)." };
  } else {
    WORLDWIDE_JOBS_STATE = { status:"done", jobs, error: failedSources.length ? `Some sources unavailable: ${failedSources.join(", ")}` : null };
  }
  render();
}
function setWorldwideCountry(name){

   own actor, own state, and rendered right inside that platform's tab. */
let EXT_LIVE_STATE = { linkedin:{status:"idle",jobs:[],error:null}, indeed:{status:"idle",jobs:[],error:null}, glassdoor:{status:"idle",jobs:[],error:null} };

  });

async function searchExtLive(plat){
  EXT_LIVE_STATE[plat] = { status:"loading", jobs:[], error:null };
  render();
  const country = countryByName(JOB_SEARCH_STATE.country);
  const src = apifySource(country, JOB_SEARCH_STATE.keyword, plat);
  if(!src){
    EXT_LIVE_STATE[plat] = { status:"error", jobs:[], error:"Apify isn't connected for this platform yet." };
    render();
    return;
  }
  try{
    const res = await fetch(src.url, { method:src.method, headers:{"Content-Type":"application/json"}, body:src.body });
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    const jobs = src.parseList(data).map(src.normalize);
    EXT_LIVE_STATE[plat] = { status:"done", jobs, error: jobs.length===0 ? "The actor ran but returned no results — check its input format in Advanced settings." : null };
  }catch(e){
    EXT_LIVE_STATE[plat] = { status:"error", jobs:[], error: "Couldn't reach Apify (network/CORS/token issue): "+e.message };
  }
  render();
}

/* ---- 5-minute auto-refresh for real live job data ----
   There's no free/keyless way to have a browser silently re-query Google
   itself on a timer — Google doesn't offer a public jobs API, direct fetches
   to google.com are blocked by CORS, and automated/scripted querying of
   Google Search results is against Google's own Terms of Service, so that
   path is skipped entirely rather than faked.
   What *is* real and repeatable: the free job-board APIs behind the
   Worldwide tab, plus Adzuna/Apify once connected. This refreshes whichever
   of those the user has already searched at least once, so results
   (including the LinkedIn/Indeed/Glassdoor Apify feed, once connected) stay
   current without the user having to click "Search" again. Silent — no
   toast/spinner spam — and skips a source entirely while a manual search on
   it is already in flight. */
const AUTO_REFRESH_MS = 5*60*1000;
function startLiveJobsAutoRefresh(){
  setInterval(()=>{
    if(WORLDWIDE_JOBS_STATE.status==="done" || WORLDWIDE_JOBS_STATE.status==="error") searchWorldwideJobs();
    ["linkedin","indeed","glassdoor"].forEach(plat=>{
      const st = EXT_LIVE_STATE[plat];
      if(st && (st.status==="done" || st.status==="error")) searchExtLive(plat);
    });
  }, AUTO_REFRESH_MS);
}

/* A live listing's location text is free-form ("Berlin, Germany", "EU only",
   "Remote — Worldwide"...), so country filtering is a best-effort substring
   match rather than an exact lookup. Remote/worldwide-open roles are always
   kept, since candidates from any country are usually free to apply. */
function jobMatchesCountry(job, countryName){
  if(!countryName || countryName==="Worldwide / Remote") return true;
  const loc = (job.location||"").toLowerCase();
  if(/remote|worldwide|anywhere|global/.test(loc)) return true;
  return loc.includes(countryName.toLowerCase());
}

let EXT_ADVANCED_OPEN = {}; // { linkedin:true/false, indeed:..., glassdoor:... } — collapsed by default
function toggleExtAdvanced(plat){
  EXT_ADVANCED_OPEN[plat] = !EXT_ADVANCED_OPEN[plat];
  render();
}
function renderExtLiveSection(plat, p, country){
  const hasActor = !!(DB?.settings?.apifyToken && DB?.settings?.apifyActors?.[plat]);
  const open = !!EXT_ADVANCED_OPEN[plat];

  // Collapsed by default — the primary, always-working flow is the real
  // "Apply/Open" links below, which need no setup. This is opt-in only.
  if(!open){
    return `<div style="margin-bottom:14px;">
      <button class="btn btn-ghost btn-sm" onclick="toggleExtAdvanced('${plat}')">⚙ Advanced (optional): show live ${p.badge} results inline${hasActor?' — connected':''}</button>
    </div>`;
  }

  const state = EXT_LIVE_STATE[plat] || { status:"idle", jobs:[], error:null };
  const formOpen = EXT_APIFY_FORM_OPEN === plat;

  let out = `<div class="card pad" style="margin-bottom:14px; border-color:${p.color}55;">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
      <div>
        <div class="name">🔴 Live ${p.badge} jobs (via Apify) <span class="muted" style="font-weight:400;">— optional</span></div>
        <div class="muted" style="font-size:12px; margin-top:2px;">${hasActor ? `Fetches real ${p.badge} listings for “${JOB_SEARCH_STATE.keyword||'internship'}” in ${country} right now.` : `${p.badge} blocks direct browser requests, so this needs your own Apify actor. Not required — "Apply on ${p.badge}" below always works without this.`}</div>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        ${hasActor ? `<button class="btn btn-primary btn-sm" onclick="searchExtLive('${plat}')">🔎 Search live ${p.badge} jobs</button>` : ""}
        <button class="btn btn-secondary btn-sm" onclick="toggleExtApifyForm('${plat}')">${hasActor?'⚙ Edit actor':'⚙ Connect Apify'}</button>
        <button class="btn btn-ghost btn-sm" onclick="toggleExtAdvanced('${plat}')">Hide</button>
      </div>
    </div>
    ${formOpen ? `<div class="divider"></div>
      <div class="muted" style="margin-bottom:8px; font-size:12.5px;">Get a free token at <a href="https://console.apify.com/account/integrations" target="_blank" rel="noopener noreferrer">console.apify.com</a>, then find a "${p.badge} Jobs Scraper" actor in the Apify Store and paste its ID below (looks like <code>username/actor-name</code>). Note: scraping ${p.badge} this way may run against its own terms of service — that's between you and the actor's operator.</div>
      <div class="row">
        <div class="field" style="margin:0; flex:1;"><label class="field-label">API Token</label><input type="text" id="apify_token_${plat}" value="${DB?.settings?.apifyToken||''}"/></div>
        <div class="field" style="margin:0; flex:1;"><label class="field-label">${p.badge} Actor ID</label><input type="text" id="apify_actor_${plat}" placeholder="username/actor-name" value="${DB?.settings?.apifyActors?.[plat]||''}"/></div>
        <button class="btn btn-primary btn-sm" onclick="saveExtApifyKeys('${plat}')">Save</button>
      </div>` : ''}
  </div>`;

  if(state.status==="loading"){
    out += `<div class="card pad" style="margin-bottom:14px;"><div class="muted">Searching live ${p.badge} listings…</div></div>`;
  } else if(state.status==="error"){
    out += `<div class="card pad" style="margin-bottom:14px; border-color:rgba(179,67,90,.4); background:rgba(179,67,90,.06);"><div class="muted">${state.error}</div></div>`;
  } else if(state.status==="done"){
    out += `<div class="muted" style="margin-bottom:10px; font-size:12px;">${state.jobs.length} live result(s) from ${p.badge} · auto-refreshes every 5 min.</div>`;
    out += state.jobs.slice(0,20).map(j=>`<div class="job-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div><div class="job-title">${j.title}</div><div class="job-company">${j.company}</div></div>
        <span style="font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:${p.color};color:#fff;">${p.badge} · Live</span>
      </div>
      <div class="job-meta" style="margin-top:6px;"><span>📍 ${j.location}</span>${j.posted?`<span>🕐 ${j.posted}</span>`:""}</div>
      ${j.description?`<div class="job-desc" style="margin-top:8px;">${j.description}…</div>`:""}
      ${j.tags.length?`<div class="job-tags">${j.tags.slice(0,8).map(t=>`<span class="job-tag">${t}</span>`).join("")}</div>`:""}
      <div class="job-actions" style="margin-top:12px;">
        <a href="${j.url}" target="_blank" rel="noopener noreferrer" class="btn" style="background:${p.color};color:#fff;border-color:${p.color};text-decoration:none;"
          onclick="trackExtApply('${j.id}','${plat}','${j.title.replace(/'/g,"")}','${j.company.replace(/'/g,"")}')">✉ Apply — opens the real listing ↗</a>
      </div>
    </div>`).join("");
  }
  return out;
}

/* ---- University job CRUD helpers ---- */
function createUniversityJob(){
  const title    = document.getElementById("unj_title").value.trim();
  const dept     = document.getElementById("unj_dept").value.trim();
  const type     = document.getElementById("unj_type").value;
  const positions= Number(document.getElementById("unj_positions").value)||1;
  const deadline = document.getElementById("unj_deadline").value;
  const stipend  = document.getElementById("unj_stipend").value.trim();
  const desc     = document.getElementById("unj_desc").value.trim();
  const skillsRaw= document.getElementById("unj_skills").value;
  const skills   = skillsRaw.split(",").map(s=>s.trim()).filter(Boolean);
  if(!title||!desc){ toast("Title and description are required."); return; }
  mutate(db=>{
    if(!db.universityJobs) db.universityJobs=[];
    db.universityJobs.push({ id:uid("uj"), title, dept, type, positions, deadline, stipend, desc, skills,
      postedBy:VIEWER_ID, postedAt:nowISO(), isOpen:true });
  });
  toast("Job posted successfully.");
  goto("jobPostings",{jobPlatform:"university"});
}
function saveUniversityJob(jid){
  mutate(db=>{
    const j = db.universityJobs.find(x=>x.id===jid);
    j.title    = document.getElementById("eunj_title_"+jid).value;
    j.dept     = document.getElementById("eunj_dept_"+jid).value;
    j.type     = document.getElementById("eunj_type_"+jid).value;
    j.positions= Number(document.getElementById("eunj_pos_"+jid).value)||j.positions;
    j.deadline = document.getElementById("eunj_deadline_"+jid).value;
    j.stipend  = document.getElementById("eunj_stipend_"+jid).value;
    j.desc     = document.getElementById("eunj_desc_"+jid).value;
    const skillsRaw = document.getElementById("eunj_skills_"+jid).value;
    j.skills = skillsRaw.split(",").map(s=>s.trim()).filter(Boolean);
  });
  toast("Job posting updated.");
  goto("jobPostings",{jobPlatform:"university"});
}
function toggleUniversityJob(jid){
  mutate(db=>{ const j=db.universityJobs.find(x=>x.id===jid); j.isOpen=!j.isOpen; });
}
function applyUniversityJob(jid){
  const user = currentUser();
  const s = studentByUserId(user.id);
  if(!s){ toast("No student profile found."); return; }
  if(!DB.universityJobApps) DB.universityJobApps=[];
  if(DB.universityJobApps.some(a=>a.studentId===s.id&&a.jobId===jid)){
    toast("You have already applied to this posting."); return;
  }
  const j = (DB.universityJobs||[]).find(x=>x.id===jid);
  mutate(db=>{
    if(!db.universityJobApps) db.universityJobApps=[];
    db.universityJobApps.push({ id:uid("uja"), studentId:s.id, jobId:jid, status:"SUBMITTED", appliedAt:nowISO(), coverNote:"" });
    db.users.filter(u=>u.role==="LIAISON_OFFICER"||u.role==="HOD").forEach(l=>
      notify(l.id,"APPLICATION_UPDATE","University job application",`${user.name} applied for "${j?j.title:'a position'}".`));
  });
  toast(`Application submitted for "${j?j.title:'this position'}".`);
}
function updateUniJobAppStatus(appId, status){
  mutate(db=>{ const a=(db.universityJobApps||[]).find(x=>x.id===appId); if(a) a.status=status; });
}

function trackExtApply(jobId, plat, title, company){
  const user = currentUser();
  const s = studentByUserId(user.id);
  if(!s||!user) return; // silent for non-students
  if(!DB.jobApplications) DB.jobApplications=[];
  if(DB.jobApplications.some(a=>a.studentId===s.id&&a.jobId===jobId&&a.platform===plat)) return;
  mutate(db=>{
    if(!db.jobApplications) db.jobApplications=[];
    db.jobApplications.push({ id:uid("ja"), studentId:s.id, jobId, platform:plat, title, company, status:"SUBMITTED", appliedAt:nowISO() });
  });
}

/* ---------------------------- Sync: supervisors <-> internship <-> surveys ---------------------------- */
/* Single source of truth: whenever a student is tagged/assigned to a faculty
   supervisor or a company supervisor, the student record, the internship
   record and the survey (evaluation) records are all kept in step. */
function ensureEvaluations(db, internship){
  const pairs = [];
  if(internship.companySupervisorUserId){
    pairs.push(["MIDTERM", internship.companySupervisorUserId]);
    pairs.push(["FINAL", internship.companySupervisorUserId]);
  }
  if(internship.facultySupervisorUserId){
    pairs.push(["FACULTY", internship.facultySupervisorUserId]);
    pairs.push(["FACULTY_FINAL", internship.facultySupervisorUserId]);
  }
  pairs.forEach(([type, evaluatorUserId])=>{
    let ev = db.evaluations.find(e=>e.internshipId===internship.id && e.type===type);
    if(!ev){
      db.evaluations.push({ id: uid("ev"), internshipId: internship.id, type, evaluatorUserId,
        scores:{}, comments:{}, strengths:"", areasForImprovement:"", additionalComments:"", overallGrade:null,
        recommendToHire:null, wouldHostAgain:null, status:"NOT_STARTED", totalScore:null, maxScore:null });
    } else if(!ev.evaluatorUserId){ ev.evaluatorUserId = evaluatorUserId; }
  });
}
function activateIfSupervised(internship){
  // Once a company supervisor is assigned, the student counts as an active
  // intern everywhere in the platform.
  if(internship && internship.companySupervisorUserId && internship.status!=="COMPLETED" && internship.status!=="TERMINATED"){
    internship.status = "ACTIVE";
    if(!internship.startDate) internship.startDate = nowISO().slice(0,10);
  }
  return internship;
}
function syncStudentLinks(db, studentId){
  const student = db.students.find(s=>s.id===studentId);
  if(!student) return null;
  let internship = db.internships.find(i=>i.studentId===studentId);
  const compSup = student.assignedCompanySupervisorId ? db.users.find(u=>u.id===student.assignedCompanySupervisorId) : null;
  if(!internship && (student.assignedCompanySupervisorId || student.assignedFacultyId)){
    internship = { id: uid("in"), applicationId:null, studentId, companyId: compSup?compSup.companyId:null, postingId:null,
      companySupervisorUserId:null, facultySupervisorUserId:null, status:"PENDING_OFFER",
      startDate:null, endDate:null, creditHours:3, grade:null };
    db.internships.push(internship);
  }
  if(!internship) return null;
  if(student.assignedCompanySupervisorId) internship.companySupervisorUserId = student.assignedCompanySupervisorId;
  if(student.assignedFacultyId) internship.facultySupervisorUserId = student.assignedFacultyId;
  if(compSup && compSup.companyId) internship.companyId = compSup.companyId;
  if(internship.companySupervisorUserId) student.assignedCompanySupervisorId = internship.companySupervisorUserId;
  if(internship.facultySupervisorUserId) student.assignedFacultyId = internship.facultySupervisorUserId;
  activateIfSupervised(internship);
  ensureEvaluations(db, internship);
  return internship;
}
function syncInternshipLinks(db, internshipId){
  const internship = db.internships.find(i=>i.id===internshipId);
  if(!internship) return null;
  const student = db.students.find(s=>s.id===internship.studentId);
  if(student){
    if(internship.companySupervisorUserId) student.assignedCompanySupervisorId = internship.companySupervisorUserId;
    if(internship.facultySupervisorUserId) student.assignedFacultyId = internship.facultySupervisorUserId;
  }
  activateIfSupervised(internship);
  ensureEvaluations(db, internship);
  return internship;
}
